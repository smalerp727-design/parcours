<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>Parcours</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  :root{--c:#0f766e;--bg:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx)}
  #map{position:fixed;inset:0}
  .fab{position:fixed;right:12px;z-index:1000;width:46px;height:46px;border-radius:50%;border:none;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:20px}
  .fab{display:flex;align-items:center;justify-content:center;padding:0}
  .fab svg{width:24px;height:24px;fill:#374151;display:block}
  #search{position:relative}
  #q{width:100%;font-size:15px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#f9fafb}
  #sres{position:absolute;left:0;right:0;top:44px;z-index:5;background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-height:260px;overflow-y:auto}
  .sr{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #f1f1f1}
  .sr div{flex:1;min-width:0}
  .sr b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr small{color:var(--mu);font-size:12px}
  .sr button{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--tx)}
  #destChip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fef2f2;color:#991b1b;border-radius:9px;padding:6px 6px 6px 10px;font-size:14px;margin-bottom:10px}
  #destChip button{border:none;background:none;font-size:16px;color:#991b1b;padding:2px 6px}
  /* Téléphone en portrait : liste qui défile horizontalement pour garder la carte visible */
  /* Téléphone (portrait) : liste verticale dans le tiroir */
  #list{margin:6px -14px 0;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;overflow-y:hidden;overscroll-behavior:contain}
  #list .it{flex:none}
  #list .it.pin{position:sticky;top:0;z-index:2}
  #list:empty{display:none}
  .it{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:11px;padding:8px 10px;color:var(--tx);font:inherit}
  .it.on{border-color:var(--c);background:#e6f4f1}
  .it .n,.rn{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#64748b;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center}
  .it.on .n,.rn.on{background:var(--c)}
  .rn{border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);line-height:18px;width:22px}
  .it div{flex:1;min-width:0}
  .it b{display:block;font-size:14px}
  .it div small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .km{font-weight:700;font-size:14px;white-space:nowrap;text-align:right}
  .it .km small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-top:3px}
  .tag.ok{background:#dcfce7;color:#166534}
  .tag.warn{background:#fef3c7;color:#92400e}
  #btnCfg{top:calc(12px + env(safe-area-inset-top))}
  #btnLoc{top:calc(66px + env(safe-area-inset-top))}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.2);padding:0 14px env(safe-area-inset-bottom);display:flex;flex-direction:column;height:170px;max-height:100%;transition:height .28s cubic-bezier(.2,.8,.2,1)}
  #panel.dragging{transition:none}
  #info .cnt{color:var(--mu)}
  #list .it.pin{touch-action:none;will-change:transform}
  #panel[data-state=full]{border-radius:0;padding-top:env(safe-area-inset-top)}
  body[data-sheet=full] #search.floating{display:none}
  #grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  #grab::before{content:'';width:40px;height:5px;border-radius:3px;background:#d1d5db}
  #sumrow{flex:none;display:flex;gap:8px;align-items:center;touch-action:none}
  #chip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#f3f4f6;border-radius:22px;height:44px;padding:0 14px;font:600 15px system-ui,sans-serif;color:var(--tx);text-align:left}
  #chipTxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chip .chev{color:var(--mu);transition:transform .2s}
  #panel.open #chip .chev{transform:rotate(180deg)}
  #go2{flex:none;width:auto;height:44px;border-radius:22px;padding:0 18px;font-size:15px}
  #ctrl{flex:none;display:none;padding-top:10px}
  #panel.open #ctrl{display:block}
  #ctrl #btnGo{display:none}
  #search.floating{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:70px;z-index:1001}
  #search.floating #q{margin:0;height:46px;border-radius:23px;border:none;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#fff;padding:0 18px}
  #search.floating #sres{top:52px}
  .leaflet-top.leaflet-left{top:calc(62px + env(safe-area-inset-top))}
  .seg{display:flex;background:#f3f4f6;border-radius:10px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:none;background:none;padding:9px 4px;border-radius:8px;font-size:15px;color:var(--mu)}
  .seg button.on{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .row .seg{margin:0;flex:0 0 120px}
  #val{flex:1;min-width:0;font-size:20px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;text-align:center}
  #unitLbl{width:34px;color:var(--mu)}
  #hint{font-size:13px;color:var(--mu);text-align:center;margin-bottom:10px;min-height:16px}
  .primary{width:100%;border:none;background:var(--c);color:#fff;font-size:17px;font-weight:600;padding:13px;border-radius:12px}
  .primary:disabled{opacity:.6}
  #info{flex:none;margin-top:8px;text-align:center;font-size:14px;min-height:18px}
  #info b{font-size:18px}
  #info .err{color:#b91c1c}
  .modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal.hidden{display:none}
  .card{background:var(--bg);border-radius:14px;padding:18px;width:100%;max-width:420px}
  .card h2{margin:0 0 12px;font-size:19px}
  .card label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mu)}
  .card input{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px}
  .speeds{display:flex;gap:8px}
  .speeds div{flex:1}
  .card small{display:block;color:var(--mu);margin-top:6px;line-height:1.4}
  .card a{color:var(--c)}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:15px}
  .btns .primary{border:none;background:var(--c);color:#fff;font-weight:600}
  [hidden]{display:none!important}
  .leaflet-control-attribution{font-size:10px}
  .leaflet-top.leaflet-left .leaflet-control-attribution{max-width:calc(100vw - 80px)}
  #styles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  /* Variantes claire et sombre obtenues en filtrant la carte OpenStreetMap */
  .tiles-clair{filter:grayscale(.9) brightness(1.08) contrast(.85)}
  .tiles-sombre{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) grayscale(.3)}
  .leaflet-container{background:#ddd}
  #btnPhoto{top:calc(120px + env(safe-area-inset-top))}
  #btnSaved{top:calc(174px + env(safe-area-inset-top))}
  #btnSaved svg{fill:#f59e0b}
  #svCount{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--c);color:#fff;font:700 11px/18px system-ui,sans-serif}
  #savedList{max-height:55vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
  #savedList .empty{color:var(--mu);font-size:14px;text-align:center;line-height:1.5}
  .sv{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f1f1f1}
  .sv div{flex:1;min-width:0}
  .sv input{width:100%;border:1px solid transparent;border-radius:7px;padding:3px 6px;font:600 15px system-ui,sans-serif;color:var(--tx);background:none}
  .sv input:focus{border-color:var(--bd);background:#f9fafb;outline:none}
  .sv small{display:block;color:var(--mu);font-size:12px;padding-left:7px;margin-top:0}
  .sv button{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--tx);white-space:nowrap}
  .sv .del.sure{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
  .btnlike{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:15px;text-align:center;cursor:pointer;margin:0 !important;color:var(--tx) !important}
  .it{cursor:pointer}
  .it .star{flex:none;border:none;background:none;font-size:20px;line-height:1;padding:4px 2px;color:#9ca3af;cursor:pointer}
  .it .star.on{color:#f59e0b}
  .ph-me{width:34px;height:34px;background:#7c3aed center/cover no-repeat;border-width:2px}
  .ph-me i{color:#fff;font-style:normal;font-size:12px;text-shadow:0 0 4px #000}
  .clu.clu-me{background:#7c3aed}
  #vVid{display:block;width:100%;max-height:62vh;background:#000;border-radius:10px}
  #vDel{flex:1;padding:11px;border-radius:10px;border:1px solid #fca5a5;background:#fff;color:#991b1b;font-size:15px}
  #vDel.sure{background:#fee2e2}
  .card label.sw{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--tx);font-size:15px;cursor:pointer}
  .sw input{width:20px;height:20px;flex:none;accent-color:var(--c)}
  .sw small{display:block;margin:0;font-size:12px}
  .ph{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .ph svg{width:14px;height:14px;display:block}
  .ph b{color:#fff;font:700 8px/1 system-ui,sans-serif}
  .ph-wiki{background:#ea580c}
  .ph-pano{background:#2563eb}
  #viewer .card{max-width:680px;padding:12px}
  #vStage{position:relative}
  .vNav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.9);box-shadow:0 1px 6px rgba(0,0,0,.4);font-size:24px;line-height:1;color:var(--tx)}
  #vPrev{left:8px} #vNext{right:8px}
  #vCount{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 10px;border-radius:12px}
  .clu{width:34px;height:34px;border-radius:50%;background:#0f766e;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px/1 system-ui,sans-serif}
  .clu svg{width:11px;height:11px;margin-bottom:1px}
  #vImg{display:block;width:100%;max-height:62vh;object-fit:contain;background:#111;border-radius:10px;min-height:120px}
  #vCap{font-size:14px;margin-top:8px;line-height:1.4}
  #vCap small{display:block;color:var(--mu);margin-top:2px}
  #vLink{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);text-align:center;text-decoration:none;color:var(--c);font-size:15px}
  #styles button{border:1px solid var(--bd);background:var(--bg);padding:9px 4px;border-radius:9px;font-size:14px;white-space:nowrap;color:var(--tx)}
  #styles button.on{background:#e6f4f1;border-color:var(--c);color:var(--c);font-weight:600}
  #vPano{width:100%;height:62vh;border-radius:10px;overflow:hidden;background:#111}
  #vTip{font-size:12px;color:var(--mu);text-align:center;margin-top:4px}


  /* Écran large (PC, tablette) ou téléphone en paysage : panneau sur le côté */
  @media (min-width:800px), (orientation:landscape) and (max-height:520px){
    /* Le haut du panneau reste fixe, seule la liste défile */
    #list{flex-direction:column;overflow-y:auto;margin:8px -4px 0;padding:0 4px;flex:1 1 auto;min-height:0}
    #ctrl{flex:none;display:block !important;padding-top:0}
    #ctrl #btnGo{display:block}
    #grab,#sumrow{display:none}
    #info{margin-top:10px;font-size:15px}
    .leaflet-top.leaflet-left{top:0}
    /* Parcours sélectionné épinglé en haut de la liste */
    #list .it.pin{position:sticky;top:0;z-index:2;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
    #list .it{flex:none}
    #panel{top:calc(12px + env(safe-area-inset-top));bottom:auto;left:calc(12px + env(safe-area-inset-left));right:auto;width:340px;height:auto !important;max-height:calc(100% - 24px);overflow:visible;display:flex;flex-direction:column;border-radius:18px;padding:14px;transition:none;box-shadow:0 2px 12px rgba(0,0,0,.2)}
  }
  /* Téléphone en paysage : panneau plus compact */
  @media (orientation:landscape) and (max-height:520px){
    #panel{width:300px;padding:10px}
    .seg{margin-bottom:6px}
    .seg button{padding:6px 4px;font-size:14px}
    #val{font-size:17px;padding:5px 8px}
    #hint{margin-bottom:6px}
    .primary{padding:10px;font-size:16px}
    #info{margin-top:6px}
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="btnCfg" class="fab" title="Réglages"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button>
<button id="btnLoc" class="fab" title="Ma position"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button>
<button id="btnPhoto" class="fab" title="Ajouter des photos ou vidéos"><svg viewBox="0 0 24 24" style="transform:translate(1px,0)"><path d="M3 4V1h2v3h3v2H5v3H3V6H0V4h3zm3 6V7h3V4h7l1.83 2H21a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10h3zm7 9a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm-3.2-5a3.2 3.2 0 1 0 6.4 0 3.2 3.2 0 0 0-6.4 0z"/></svg></button>
<input id="mediaIn" type="file" accept="image/*,video/*" multiple hidden>

<button id="btnSaved" class="fab" title="Mes parcours"><svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span id="svCount" hidden></span></button>

<div id="savedModal" class="modal hidden">
  <div class="card">
    <h2>Mes parcours</h2>
    <div id="savedList"></div>
    <div class="btns">
      <button id="svExport">Exporter</button>
      <label class="btnlike">Importer<input id="svImport" type="file" accept=".json,application/json" hidden></label>
      <button id="svClose" class="primary">Fermer</button>
    </div>
    <small>Enregistrés sur cet appareil. « Exporter » en fait une copie (fichier) pour ne pas les perdre ou les mettre sur un autre téléphone.</small>
  </div>
</div>

<div id="viewer" class="modal hidden">
  <div class="card">
    <div id="vStage">
      <img id="vImg" alt="">
      <video id="vVid" controls playsinline hidden></video>
      <div id="vPano" hidden></div>
      <button id="vPrev" class="vNav" title="Photo précédente">‹</button>
      <button id="vNext" class="vNav" title="Photo suivante">›</button>
      <div id="vCount"></div>
    </div>
    <div id="vTip" hidden>📱 Fais glisser pour regarder autour · pince pour zoomer</div>
    <div id="vCap"></div>
    <div class="btns">
      <a id="vLink" href="#" target="_blank" rel="noopener">Voir la source</a>
      <button id="vDel" hidden>🗑 Supprimer</button>
      <button id="vClose" class="primary">Fermer</button>
    </div>
  </div>
</div>

<div id="panel">
 <div id="grab" title="Glisser pour agrandir"></div>
 <div id="sumrow">
   <button id="chip"><span id="chipTxt"></span><span class="chev">▾</span></button>
   <button id="go2" class="primary">Générer</button>
 </div>
 <div id="ctrl">
  <div id="search">
    <input id="q" type="search" placeholder="Rechercher un lieu, une adresse…" autocomplete="off" enterkeyhint="search">
    <div id="sres" hidden></div>
  </div>
  <div class="seg" id="segMode">
    <button data-v="marche">🚶 Marche</button>
    <button data-v="course">🏃 Course</button>
    <button data-v="velo">🚴 Vélo</button>
  </div>
  <div class="seg" id="segType">
    <button data-v="boucle">🔄 Boucle</button>
    <button data-v="aller">➡️ Aller simple</button>
  </div>
  <div id="destChip" hidden><span id="destName"></span><button id="destClear" title="Retirer l'arrivée">✕</button></div>
  <div class="row" id="valRow">
    <div class="seg" id="segUnit">
      <button data-v="km">km</button>
      <button data-v="min">min</button>
    </div>
    <input id="val" type="number" inputmode="decimal" min="0" step="any">
    <span id="unitLbl">km</span>
  </div>
  <div id="hint"></div>
  <button id="btnGo" class="primary">Générer un parcours</button>
  </div>
  <div id="info"></div>
  <div id="list"></div>

</div>

<div id="cfg" class="modal hidden">
  <div class="card">
    <h2>Réglages</h2>
    <label>Style de carte</label>
    <div id="styles"></div>
    <label>Photos sur la carte</label>
    <label class="sw"><input type="checkbox" id="optPhotos"><span>Photos autour du parcours<small>Wikimedia Commons et Panoramax</small></span></label>
    <label class="sw"><input type="checkbox" id="optMine"><span>Mes photos et vidéos<small>ajoutées avec le bouton 📷+</small></span></label>
    <label>Vitesses moyennes (km/h) — servent à convertir une durée en distance</label>
    <div class="speeds">
      <div><small>Marche</small><input id="spMarche" type="number" inputmode="decimal" step="0.5"></div>
      <div><small>Course</small><input id="spCourse" type="number" inputmode="decimal" step="0.5"></div>
      <div><small>Vélo</small><input id="spVelo" type="number" inputmode="decimal" step="0.5"></div>
    </div>
    <div class="btns">
      <button id="cfgCancel">Annuler</button>
      <button id="cfgSave" class="primary">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('prc_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('prc_'+k, JSON.stringify(v)); }catch(e){} }
};

// Serveurs de calcul d'itinéraire gratuits et sans compte (FOSSGIS / OSRM, données OpenStreetMap)
const PROFILES = {
  marche:'https://routing.openstreetmap.de/routed-foot',
  course:'https://routing.openstreetmap.de/routed-foot',
  velo:  'https://routing.openstreetmap.de/routed-bike'
};
let cfg = store.get('cfg', { speeds:{ marche:5, course:10, velo:18 } });
let st  = store.get('st',  { mode:'course', type:'boucle', unit:'km', val:5 });

let start = null, startMarker = null, endMarker = null, meMarker = null, meLL = null, routeLayer = null;

/* ---------- Carte ---------- */
const map = L.map('map', { zoomControl:false }).setView([45.75, 4.85], 13);
const OSM = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const ATTR_END = ' · itinéraires FOSSGIS · <a href="https://www.openstreetmap.org/fixthemap">Signaler une erreur</a>';
const STYLES = {
  plan:      { label:'🗺️ Plan',      url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', max:19, attr:OSM },
  clair:     { label:'⬜ Clair',     url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', max:19, attr:OSM, cls:'tiles-clair' },
  sombre:    { label:'⬛ Sombre',    url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', max:19, attr:OSM, cls:'tiles-sombre', dark:true },
  satellite: { label:'🛰️ Satellite', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', max:19, attr:'Imagerie © Esri · ' + OSM, dark:true },
  relief:    { label:'⛰️ Relief',    url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', max:17, sub:'abc', attr:OSM + ' · © OpenTopoMap (CC-BY-SA)' },
  velo:      { label:'🚲 Vélo',      url:'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', max:20, sub:'abc', attr:OSM + ' · CyclOSM' }
};
let tiles = null;
const routeStyle = () => ({ color: STYLES[st.style].dark ? '#22d3ee' : '#0f766e', weight:5, opacity:.9 });

function setStyle(k){
  if(!STYLES[k]) k = 'plan';
  st.style = k; store.set('st', st);
  const s = STYLES[k];
  if(tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(s.url, { maxZoom:s.max, subdomains:s.sub || 'abc', className:s.cls || '', attribution:s.attr + ATTR_END }).addTo(map);
  if(map.getZoom() > s.max) map.setZoom(s.max);
  if(routeLayer) routeLayer.setStyle(routeStyle());
  $('styles').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === k));
}
$('styles').innerHTML = Object.keys(STYLES).map(k => '<button data-v="' + k + '">' + STYLES[k].label + '</button>').join('');
$('styles').querySelectorAll('button').forEach(b => b.onclick = () => setStyle(b.dataset.v));
setStyle(st.style || 'plan');

/* ---------- Mise en page selon la taille de la fenêtre ---------- */
const WIDE = window.matchMedia('(min-width:800px), (orientation:landscape) and (max-height:520px)');
function fitRoute(){
  if(!routeLayer) return;
  const p = $('panel');
  map.fitBounds(routeLayer.getBounds(), WIDE.matches
    ? { paddingTopLeft:[p.offsetWidth + 40, 30], paddingBottomRight:[70, 30] }
    : { paddingTopLeft:[30, 30], paddingBottomRight:[70, p.offsetHeight + 20] });
}
function applyLayout(){
  map.attributionControl.setPosition(WIDE.matches ? 'bottomright' : 'topleft');
  placeSearch();
  if(WIDE.matches){ $('panel').style.height = ''; $('list').style.overflowY = $('list').style.touchAction = ''; }
  else setSheet(sheetState);
  map.invalidateSize();
  fitRoute();
}
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(applyLayout, 250); });
applyLayout();

const pin = color => L.divIcon({
  className:'', iconSize:[22,22], iconAnchor:[11,11],
  html:`<div style="width:22px;height:22px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`
});

function setStart(ll){
  start = [ll[0], ll[1]];
  if(!startMarker) startMarker = L.marker(start, { icon:pin('#16a34a') }).addTo(map);
  else startMarker.setLatLng(start);
}

map.on('click', e => {
  setStart([e.latlng.lat, e.latlng.lng]); msg('Départ placé ici.'); });

/* ---------- Géolocalisation ---------- */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(p => {
    meLL = [p.coords.latitude, p.coords.longitude];
    if(!meMarker) meMarker = L.circleMarker(meLL, { radius:7, color:'#fff', weight:2, fillColor:'#2563eb', fillOpacity:1 }).addTo(map);
    else meMarker.setLatLng(meLL);
    if(!start){ setStart(meLL); map.setView(meLL, 15); }
  }, err => {
    if(!start) msg('Position introuvable : touche la carte pour placer ton départ.', true);
  }, { enableHighAccuracy:true, maximumAge:5000 });
} else {
  msg('Géolocalisation indisponible : touche la carte pour placer ton départ.', true);
}

$('btnLoc').onclick = () => {
  if(meLL){ setStart(meLL); map.setView(meLL, 15); msg('Départ = ta position actuelle.'); return; }
  if(!navigator.geolocation) return;
  msg('Localisation en cours…');
  navigator.geolocation.getCurrentPosition(
    p => { const ll = [p.coords.latitude, p.coords.longitude]; setStart(ll); map.setView(ll, 15); msg(''); },
    e => msg('Position introuvable (' + e.message + ').', true),
    { enableHighAccuracy:true, timeout:15000 }
  );
};

/* ---------- Contrôles ---------- */
function seg(id, key, onchange){
  const el = $(id), btns = el.querySelectorAll('button');
  btns.forEach(b => {
    b.classList.toggle('on', b.dataset.v === st[key]);
    b.onclick = () => {
      const old = st[key];
      st[key] = b.dataset.v;
      btns.forEach(x => x.classList.toggle('on', x === b));
      if(onchange) onchange(old);
      store.set('st', st);
      hint();
    };
  });
}
const speed = () => cfg.speeds[st.mode] || 5;

seg('segMode', 'mode');
seg('segType', 'type', () => { if(st.type === 'boucle') clearDest(); });
seg('segUnit', 'unit', old => {
  if(old === st.unit) return;
  const v = parseFloat($('val').value) || 0;
  $('val').value = st.unit === 'min' ? Math.round(v / speed() * 60) : Math.round(v * speed() / 60 * 10) / 10;
  st.val = parseFloat($('val').value);
  $('unitLbl').textContent = st.unit;
});
$('val').value = st.val;
$('unitLbl').textContent = st.unit;
$('val').oninput = () => { st.val = parseFloat($('val').value) || 0; store.set('st', st); hint(); };

function targetMeters(){
  const v = parseFloat($('val').value) || 0;
  return st.unit === 'km' ? v * 1000 : v / 60 * speed() * 1000;
}
function fmtMin(m){
  m = Math.round(m);
  return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + String(m % 60).padStart(2, '0');
}
function hint(){
  const t = targetMeters();
  $('hint').textContent = !t ? '' : st.unit === 'km'
    ? '≈ ' + fmtMin(t/1000 / speed() * 60) + ' à ' + speed() + ' km/h'
    : '≈ ' + (t/1000).toFixed(1) + ' km à ' + speed() + ' km/h';
  if(sheetReady) updateChip();
}
hint();

function msg(t, err){ $('info').innerHTML = err ? '<span class="err">' + t + '</span>' : t; }

/* ---------- Réglages ---------- */
function openCfg(){
  $('spMarche').value = cfg.speeds.marche;
  $('spCourse').value = cfg.speeds.course;
  $('spVelo').value = cfg.speeds.velo;
  $('cfg').classList.remove('hidden');
}
$('btnCfg').onclick = openCfg;
$('cfgCancel').onclick = () => $('cfg').classList.add('hidden');
$('cfgSave').onclick = () => {
  cfg.speeds = {
    marche: parseFloat($('spMarche').value) || 5,
    course: parseFloat($('spCourse').value) || 10,
    velo:   parseFloat($('spVelo').value)   || 18
  };
  store.set('cfg', cfg);
  $('cfg').classList.add('hidden');
  hint();
  msg('Réglages enregistrés.');
};

/* ---------- Calcul d'itinéraire (OSRM / FOSSGIS, sans compte) ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let lastReq = 0;

// pts = liste de [lat, lng] ; renvoie la réponse OSRM complète
async function route(base, pts, extra){
  const wait = lastReq + 1100 - Date.now();      // règle du serveur : 1 demande par seconde
  if(wait > 0) await sleep(wait);
  lastReq = Date.now();
  const coords = pts.map(p => p[1].toFixed(6) + ',' + p[0].toFixed(6)).join(';');
  let r;
  try{
    r = await fetch(base + '/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=true&continue_straight=true' + (extra || ''));
  }catch(e){ throw new Error('Pas de connexion au serveur d\'itinéraires.'); }
  if(r.status === 429) throw new Error('Trop de demandes : attends quelques secondes.');
  const j = await r.json().catch(() => ({}));
  if(!r.ok || j.code !== 'Ok' || !j.routes || !j.routes.length)
    throw new Error(j.code === 'NoRoute' ? 'Aucun chemin trouvé ici : essaie un autre départ.' : 'Calcul impossible (' + (j.message || r.status) + ').');
  return j;
}

// Point situé à "dist" mètres de ll, dans la direction "brg" (degrés)
function destPoint(ll, dist, brg){
  const R = 6371000, d = dist / R, b = brg * Math.PI / 180;
  const la1 = ll[0] * Math.PI / 180, lo1 = ll[1] * Math.PI / 180;
  const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(b));
  const lo2 = lo1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la1), Math.cos(d) - Math.sin(la1) * Math.sin(la2));
  return [la2 * 180 / Math.PI, lo2 * 180 / Math.PI];
}

// Points de passage d'une boucle : un cercle qui passe par le départ
function loopPoints(ll, length, brg){
  const n = length < 4000 ? 3 : 4;
  const r = length / (2 * Math.PI);
  const center = destPoint(ll, r, brg);
  const back = (brg + 180) % 360;
  const pts = [ll];
  for(let k = 1; k <= n; k++) pts.push(destPoint(center, r, back + k * 360 / (n + 1)));
  pts.push(ll);
  return pts;
}

/* --- Qualité du tracé --- */
const llOf = c => [c[1], c[0]];
function lengthOf(coords){ let d = 0; for(let i = 1; i < coords.length; i++) d += hav(llOf(coords[i-1]), llOf(coords[i])); return d; }

// Supprime les allers-retours exacts (on va au bout d'une rue puis on revient sur ses pas)
function removeSpikes(coords){
  const s = [];
  for(const c of coords){
    if(s.length && hav(llOf(s[s.length-1]), llOf(c)) < 1) continue;
    if(s.length >= 2 && hav(llOf(s[s.length-2]), llOf(c)) < 3){ s.pop(); continue; }
    s.push(c);
  }
  return s;
}
// Ajoute des points tous les ~10 m pour analyser finement le tracé
function densify(coords, step){
  const out = [coords[0]];
  for(let i = 1; i < coords.length; i++){
    const a = coords[i-1], b = coords[i], n = Math.floor(hav(llOf(a), llOf(b)) / step);
    for(let t = 1; t <= n; t++) out.push([a[0] + (b[0]-a[0]) * t/(n+1), a[1] + (b[1]-a[1]) * t/(n+1)]);
    out.push(b);
  }
  return out;
}
function cumul(P){ const a = [0]; for(let i = 1; i < P.length; i++) a.push(a[i-1] + hav(llOf(P[i-1]), llOf(P[i]))); return a; }
// Grille pour retrouver vite les points proches les uns des autres
function grid(P, cell, from, to){
  const g = new Map(), k = c => Math.floor(c[1] * 111000 / cell) + ',' + Math.floor(c[0] * 78000 / cell);
  for(let i = from; i <= to; i++){ const key = k(P[i]); if(!g.has(key)) g.set(key, []); g.get(key).push(i); }
  return { near(c){
    const y = Math.floor(c[1] * 111000 / cell), x = Math.floor(c[0] * 78000 / cell), out = [];
    for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){ const l = g.get((y+dy) + ',' + (x+dx)); if(l) out.push(...l); }
    return out;
  }};
}
// Part d'un tronçon (i → j) où l'on repasse à moins de 15 m d'un endroit déjà emprunté
function doubledShare(P, arc, i, j){
  const g = grid(P, 15, i, j); let n = 0;
  for(let k = i; k <= j; k++){
    if(g.near(P[k]).some(m => Math.abs(arc[m] - arc[k]) > 40 && hav(llOf(P[m]), llOf(P[k])) < 15)) n++;
  }
  return n / (j - i + 1);
}
// Coupe les détours "aller-retour" : on revient presque au même point en ayant surtout refait le même chemin
function cleanLoop(coords){
  let P = densify(removeSpikes(coords), 10);
  for(let pass = 0; pass < 3; pass++){
    const arc = cumul(P), total = arc[arc.length-1], g = grid(P, 20, 0, P.length - 1), out = [];
    let i = 0, changed = false;
    while(i < P.length){
      out.push(P[i]);
      let jBest = -1;
      for(const j of g.near(P[i])){
        if(j <= i || j <= jBest) continue;
        const a = arc[j] - arc[i];
        if(a < 40 || a > 0.45 * total) continue;
        if(hav(llOf(P[i]), llOf(P[j])) < 20) jBest = j;
      }
      if(jBest > 0 && doubledShare(P, arc, i, jBest) > 0.6){ i = jBest; changed = true; }
      else i++;
    }
    P = out;
    if(!changed) break;
  }
  return P;
}
// Part du parcours complet empruntée deux fois
function overlapOf(coords){
  const P = densify(coords, 10), arc = cumul(P);
  return doubledShare(P, arc, 0, P.length - 1);
}
// Part du parcours "a" qui passe à moins de 25 m du parcours "b"
function similarity(a, b){
  const A = densify(a.geometry.coordinates, 20), B = densify(b.geometry.coordinates, 20);
  const g = grid(B, 25, 0, B.length - 1);
  let n = 0;
  for(const p of A) if(g.near(p).some(m => hav(llOf(B[m]), llOf(p)) < 25)) n++;
  return n / A.length;
}
function roadNames(r){
  const seen = new Set();
  (r.legs || []).forEach(l => (l.steps || []).forEach(s => {
    if(s.name && s.distance > 150) seen.add(s.name);
  }));
  return [...seen];
}

const DIRS = ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ouest', 'ouest', 'nord-ouest'];
const dirOf = brg => DIRS[Math.round((((brg % 360) + 360) % 360) / 45) % 8];

function makeCandidate(r, coords, extra){
  return Object.assign({ geometry:{ type:'LineString', coordinates:coords }, distance:lengthOf(coords),
    overlap:overlapOf(coords), names:roadNames(r), lm:[] }, extra);
}
function scoreOf(c, target){
  if(c.kind === 'dest') return c.distance;
  // Un aller-retour pèse plus lourd qu'un écart de distance : mieux vaut un parcours un peu plus long ou court
  return Math.abs(c.distance - target) / target + c.overlap * 3;
}

// Calcule un parcours dans une direction donnée (3 essais max) :
// on ajuste la taille si la distance s'écarte, on tourne un peu le parcours s'il contient des allers-retours
// "learn" garde en mémoire le rapport demandé / obtenu : les parcours suivants visent juste du 1er coup
// Écart maximum accepté par rapport à l'objectif : ±1,5 km (ou ±30 min),
// et au plus ±30 % pour les petites distances (2 km → ±600 m)
function tolerance(target){
  const abs = st.unit === 'km' ? 1500 : 0.5 * speed() * 1000;
  return Math.min(abs, 0.3 * target);
}
const fits = (c, target) => Math.abs(c.distance - target) <= tolerance(target);

async function buildCandidate(base, kind, brg0, target, learn){
  let factor = learn.factor, brg = brg0, best = null;
  for(let i = 0; i < 3; i++){
    const req = target * factor;
    const pts = kind === 'boucle' ? loopPoints(start, req, brg) : [start, destPoint(start, req, brg)];
    const j = await route(base, pts);
    const r = j.routes[0];
    const coords = kind === 'boucle' ? cleanLoop(r.geometry.coordinates) : r.geometry.coordinates;
    const wp = j.waypoints || [];
    const c = makeCandidate(r, coords, { kind, brg:brg0, endName: kind === 'aller' && wp.length ? wp[wp.length-1].name : '' });
    // On garde le meilleur essai, en privilégiant ceux qui respectent l'écart maximum
    if(!best || (fits(c, target) && !fits(best, target)) ||
       (fits(c, target) === fits(best, target) && scoreOf(c, target) < scoreOf(best, target))) best = c;
    if(c.distance) learn.factor = factor * target / c.distance;
    const err = Math.abs(c.distance - target) / target;
    if(!fits(c, target)) factor = learn.factor;            // trop loin de l'objectif : on réajuste la taille
    else if(c.overlap > 0.08){ if(i === 2) break; brg += 25; }   // allers-retours : on décale le parcours
    else if(err > 0.1 && i === 0) factor = learn.factor;   // dans la marge mais améliorable : 1 essai de plus
    else break;
  }
  return best && fits(best, target) ? best : null;   // hors marge : parcours non proposé
}

/* ---------- Noms marquants (Wikipédia : parcs, quais, monuments…) ---------- */
const lmCache = new Map();
function wikiAround(p, radius){
  const k = p[0].toFixed(3) + ',' + p[1].toFixed(3) + ',' + radius;
  if(!lmCache.has(k)) lmCache.set(k, getJSON('https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
    '&list=geosearch&gslimit=50&gsprop=type%7Cdim&gsradius=' + radius +
    '&gscoord=' + p[0].toFixed(5) + '%7C' + p[1].toFixed(5))
    .then(j => (j.query && j.query.geosearch) || []).catch(() => []));
  return lmCache.get(k);
}
const LM_KEY = /parc|jardin|quai|berge|pont|passerelle|place|square|esplanade|promenade|basilique|cathédrale|église|abbaye|chapelle|musée|théâtre|opéra|colline|lac|étang|île|bois|forêt|fontaine|tour|château|fort|halle|hôtel|hôpital|stade|port|marina|plage|belvédère|arc|statue|monument|mairie|palais|gare/i;
const LM_STRONG = /^(parc|jardin|quais?|berges?|lac|île|bois|forêt|colline|promenade|esplanade|belvédère|plage)\b/i;
const LM_BADTYPE = /^(country|state|adm|city|edu|event|satellite|airport)/;
const LM_BADNAME = /^(rue|avenue|boulevard|cours|impasse|chemin|route|liste|arrondissement|quartier|ligne|tunnel|autoroute)\b/i;
const cleanName = t => t.replace(/\s*\([^)]*\)\s*$/, '');

async function landmarksOf(c){
  const line = c.geometry.coordinates.map(llOf);
  const step = Math.max(300, c.distance / 10);
  const res = await inBatches(samples(line, step), 4, p => wikiAround(p, Math.min(10000, Math.round(step * 0.8))));
  const found = new Map();
  res.flat().forEach(g => {
    if(!g || found.has(g.pageid) || (g.type && LM_BADTYPE.test(g.type))) return;
    if(!LM_KEY.test(g.title) || LM_BADNAME.test(g.title)) return;
    const tol = Math.min(600, Math.max(80, (parseFloat(g.dim) || 0) / 2));   // grands parcs : on tolère plus loin
    let best = Infinity, idx = 0;
    for(let i = 0; i < line.length; i += 2){ const d = hav(line[i], [g.lat, g.lon]); if(d < best){ best = d; idx = i; } }
    if(best > tol) return;
    found.set(g.pageid, { name:cleanName(g.title), idx,
      score:(LM_STRONG.test(g.title) ? 5 : 3) + (g.type === 'landmark' ? 1 : 0) - best / 300 });
  });
  let lm = [...found.values()].sort((a, b) => b.score - a.score)
    .filter((l, i, arr) => arr.findIndex(x => x.name.toLowerCase() === l.name.toLowerCase()) === i);
  // Les quais et berges empruntés comptent aussi, même sans article Wikipédia
  c.names.filter(n => /^(quai|berges?|promenade|allée|esplanade|voie verte)\b/i.test(n))
    .forEach(n => { if(!lm.some(l => l.name.toLowerCase() === n.toLowerCase())) lm.push({ name:n, idx:0, score:2 }); });
  return lm.slice(0, 3);
}
function nameRoutes(list){
  list.forEach(c => landmarksOf(c).then(lm => { c.lm = lm; if(candidates.includes(c)) renderList(); }).catch(() => {}));
}

/* ---------- Liste des parcours proposés ---------- */
let candidates = [], selected = null, genRun = 0, userPicked = false, altLayer = L.layerGroup().addTo(map);

function titleOf(c, i){
  if(c.savedName) return c.savedName;
  const top = c.lm[0] && c.lm[0].name;
  if(c.kind === 'dest') return (i === 0 ? 'Conseillé' : 'Variante ' + i) + (top ? ' · par ' + top : '');
  if(top) return (c.kind === 'boucle' ? 'Boucle · ' : 'Vers ') + top;
  const d = dirOf(c.brg);
  if(c.kind === 'boucle') return 'Boucle ' + d;
  return 'Vers ' + (/^[eo]/.test(d) ? 'l\'' : 'le ') + d;
}
function subOf(c){
  const more = c.lm.slice(1).map(l => l.name);
  const d = c.kind === 'dest' ? '' : 'côté ' + dirOf(c.brg);
  if(more.length) return [more.join(' · '), d].filter(Boolean).join(' — ');
  const n = c.names.slice(0, 2);
  if(c.kind === 'aller' && c.endName) return 'arrivée ' + c.endName;
  return [n.length ? 'via ' + n.join(', ') : '', d].filter(Boolean).join(' — ');
}

/* --- Liste défilante : la carte n'affiche que les parcours visibles dans la liste --- */
const visible = new Set();          // parcours dont la carte est visible dans la liste
let syncQueued = false;
let listObs = null;
function makeObserver(topHidden){
  // topHidden : hauteur cachée par le parcours épinglé (les cartes passées dessous ne comptent pas)
  return new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) visible.add(e.target._c); else visible.delete(e.target._c); });
    queueSync();
  }, { root: $('list'), threshold: 0.35, rootMargin: '-' + Math.round(topHidden) + 'px 0px 0px 0px' });
}
function queueSync(){ if(!syncQueued){ syncQueued = true; requestAnimationFrame(() => { syncQueued = false; syncMap(); }); } }

function renderList(){
  const L_ = $('list');
  const keepX = L_.scrollLeft, keepY = L_.scrollTop;
  if(listObs) listObs.disconnect();
  visible.clear();
  L_.innerHTML = '';
  // Le parcours sélectionné en premier (épinglé en haut), puis les autres dans l'ordre
  const order = selected && candidates.includes(selected) ? [selected].concat(candidates.filter(c => c !== selected)) : candidates;
  order.forEach(c => {
    const i = candidates.indexOf(c), km = c.distance / 1000;
    const b = document.createElement('div');
    b.className = 'it' + (c === selected ? ' on pin' : '');
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    const tag = c.kind !== 'boucle' ? '' : c.overlap < 0.05
      ? '<span class="tag ok">✓ Sans aller-retour</span>'
      : '<span class="tag warn">↩︎ ' + Math.round(c.overlap * 100) + ' % en double</span>';
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><div><b></b><small></small>' + tag + '</div>' +
      '<span class="km">' + km.toFixed(1) + ' km<small>≈ ' + fmtMin(km / speed() * 60) + '</small></span>';
    b.querySelector('b').textContent = titleOf(c, i);
    b.querySelector('div small').textContent = subOf(c);
    b.onclick = () => pick(c);
    const star = document.createElement('button');
    const sv = isSaved(c);
    star.className = 'star' + (sv ? ' on' : '');
    star.textContent = sv ? '★' : '☆';
    star.title = sv ? 'Retirer de Mes parcours' : 'Enregistrer ce parcours';
    star.onclick = e => { e.stopPropagation(); toggleSave(c); };
    b.appendChild(star);
    b._c = c;
    L_.appendChild(b);
  });
  const pinned = L_.querySelector('.pin');
  listObs = makeObserver(WIDE.matches && pinned ? pinned.offsetHeight + 6 : 0);
  L_.querySelectorAll('.it:not(.pin)').forEach(b => listObs.observe(b));
  L_.scrollLeft = keepX; L_.scrollTop = keepY;
  if(sheetReady && !WIDE.matches && sheetState !== 'full') setSheet(sheetState);   // hauteur du tiroir replié
}

// Tracés gris préparés une seule fois par parcours : les afficher / masquer est instantané
function greyOf(c){
  if(!c._grey){
    c._grey = L.layerGroup([
      L.geoJSON(c.geometry, { interactive:false, style:{ color:'#64748b', weight:4, opacity:.5 } }),
      // zone invisible plus large, pour pouvoir toucher le tracé au doigt
      L.geoJSON(c.geometry, { bubblingMouseEvents:false, style:{ color:'#000', weight:24, opacity:0 } })
        .on('click', e => { L.DomEvent.stop(e); pick(c); })
    ]);
  }
  return c._grey;
}
const shownGrey = new Set();
let numLayer = L.layerGroup().addTo(map);
function syncMap(){
  const want = new Set(candidates.filter(c => c !== selected && visible.has(c)));
  shownGrey.forEach(c => { if(!want.has(c)){ altLayer.removeLayer(greyOf(c)); shownGrey.delete(c); } });
  want.forEach(c => { if(!shownGrey.has(c)){ altLayer.addLayer(greyOf(c)); shownGrey.add(c); } });
  // Numéros sur la carte : parcours visibles + sélectionné
  numLayer.clearLayers();
  candidates.forEach((c, i) => {
    if(c !== selected && !want.has(c)) return;
    const co = c.geometry.coordinates[Math.floor(c.geometry.coordinates.length * 0.4)];
    L.marker([co[1], co[0]], { zIndexOffset:300, icon:L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11],
      html:'<div class="rn' + (c === selected ? ' on' : '') + '">' + (i + 1) + '</div>' }) }).on('click', () => pick(c)).addTo(numLayer);
  });
}

function drawAll(){
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
  if(endMarker){ map.removeLayer(endMarker); endMarker = null; }
  // parcours retirés de la liste (nouvelle recherche) : on enlève leur tracé
  shownGrey.forEach(c => { if(!candidates.includes(c) || c === selected){ altLayer.removeLayer(greyOf(c)); shownGrey.delete(c); } });
  queueSync();
  if(!selected) return;
  routeLayer = L.geoJSON(selected.geometry, { bubblingMouseEvents:false, style:routeStyle() }).addTo(map);
  if(selected.kind !== 'boucle'){
    const co = selected.geometry.coordinates, last = co[co.length - 1];
    endMarker = L.marker([last[1], last[0]], { icon:pin('#dc2626') }).addTo(map);
  }
}

// Choix fait par l'utilisateur (liste ou carte) : on ne le remplace plus pendant le calcul
function pick(c){ userPicked = true; select(c); }

function select(c, noFit){
  selected = c;
  drawAll();
  renderList();
  if(!WIDE.matches && sheetReady && sheetState !== 'peek'){
    // Téléphone : on replie le tiroir pour montrer le parcours sur la carte
    $('panel').classList.remove('open');
    setSheet('peek');
    if(!noFit) setTimeout(fitRoute, 320);
  } else if(!noFit) fitRoute();
  const km = c.distance / 1000;
  msg('<b>' + km.toFixed(1) + ' km</b> · ≈ ' + fmtMin(km / speed() * 60) +
      (candidates.length > 1 ? ' · <span class="cnt">' + (candidates.indexOf(c) + 1) + '/' + candidates.length + '</span>' : ''));
  lastRoute = c;
  loadPhotos(c);
}

let lastGenKey = '';
async function generate(){
  if(!start){ msg('Position inconnue : touche la carte pour placer ton départ.', true); return; }
  const target = targetMeters();
  if(!dest){
    if(!(target >= 300)){ msg('Objectif trop court (300 m minimum).', true); return; }
    if(target > 100000){ msg('Objectif limité à 100 km.', true); return; }
  }
  const run = ++genRun, base = PROFILES[st.mode];
  if(!WIDE.matches && sheetReady){ $('panel').classList.remove('open'); setSheet('peek'); }

  // Même départ, même activité, même type : on garde les parcours déjà proposés, les nouveaux s'ajoutent à la suite
  const key = [start[0].toFixed(5), start[1].toFixed(5), st.mode, st.type, dest ? dest.ll.join(',') : ''].join('|');
  // (sauf ceux qui ne respectent plus l'écart maximum si la distance a changé)
  const keep = key === lastGenKey ? candidates.filter(c => dest || fits(c, target)) : [];
  let outOfRange = 0;
  lastGenKey = key;
  let fresh = [];
  const show = () => { candidates = keep.concat(fresh); };

  // Ajout à une liste existante : l'ordre et le parcours sélectionné ne bougent pas
  const prevSel = keep.length ? (keep.includes(selected) ? selected : keep[0]) : null;
  candidates = keep.slice(); selected = prevSel; userPicked = false;
  if(!prevSel){ lastRoute = null; photoRun++; photoLayer.clearLayers(); }
  drawAll(); renderList();
  $('btnGo').disabled = true;
  msg('');
  let lastErr = null;
  const isNew = c => !fresh.concat(keep).some(o => similarity(c, o) > 0.7);   // pas un quasi-doublon

  if(dest){
    // Destination choisie : itinéraire conseillé + variantes
    $('btnGo').textContent = 'Calcul des itinéraires…';
    try{
      const j = await route(base, [start, dest.ll], '&alternatives=3');
      if(run !== genRun) return;
      j.routes.map(r => makeCandidate(r, r.geometry.coordinates, { kind:'dest' }))
        .forEach(c => { if(isNew(c)) fresh.push(c); });
    }catch(e){ lastErr = e; }
  } else {
    // 10 directions différentes, calculées l'une après l'autre
    const N = 10, off = Math.random() * 36;
    const learn = { factor: st.type === 'boucle' ? 1 / 1.25 : 1 / 1.3 };
    for(let k = 0; k < N; k++){
      if(run !== genRun) return;
      $('btnGo').textContent = 'Calcul des parcours… ' + (k + 1) + ' / ' + N;
      try{
        const c = await buildCandidate(base, st.type, off + k * 360 / N, target, learn);
        if(run !== genRun) return;
        if(!c){ outOfRange++; continue; }   // impossible de respecter la distance dans cette direction
        if(!isNew(c)) continue;
        // Pendant le calcul : les nouveaux parcours s'ajoutent à la suite, sans réordonner
        fresh.push(c); show();
        if(!selected){
          selected = c;
          drawAll(); renderList(); fitRoute();
          const km = c.distance / 1000;
          msg('<b>' + km.toFixed(1) + ' km</b> · ≈ ' + fmtMin(km / speed() * 60));
        } else { drawAll(); renderList(); }
      }catch(e){ lastErr = e; if(/connexion|demandes/.test(e.message)) break; }
    }
    // On écarte les nouveaux parcours avec trop d'allers-retours s'il existe mieux
    if(fresh.some(c => c.overlap <= 0.1)) fresh = fresh.filter(c => c.overlap <= 0.1);
  }

  $('btnGo').disabled = false;
  if(run !== genRun) return;
  // Nouveaux parcours triés entre eux puis ajoutés après les précédents (60 au maximum)
  fresh.sort((a, b) => scoreOf(a, target) - scoreOf(b, target));
  show();
  candidates = candidates.slice(0, 60);
  $('btnGo').textContent = candidates.length ? '🔁 Autres parcours' : 'Générer un parcours';
  if(!candidates.length){
    const t = tolerance(target);
    msg(lastErr && !outOfRange ? lastErr.message : 'Aucun parcours trouvé à ±' + (st.unit === 'km' ? (t / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(t / speed() / 1000 * 60) + ' min') + ' de ton objectif ici : réessaie, ou change de départ ou de distance.', true);
    return;
  }
  if(keep.length){
    // Liste complétée : on garde le parcours sélectionné
    if(!candidates.includes(selected)) select(candidates[0]);
    else { drawAll(); renderList(); }
    const added = fresh.filter(c => candidates.includes(c)).length;
    if(!added) msg((lastErr ? lastErr.message + ' ' : '') + 'Pas de nouveau parcours différent cette fois : réessaie ou change de distance.', !!lastErr);
    else msg('+ ' + added + ' nouveau' + (added > 1 ? 'x' : '') + ' parcours ajouté' + (added > 1 ? 's' : '') + ' en fin de liste (' + candidates.length + ' en tout).');
  }
  else if(userPicked && candidates.includes(selected)){ drawAll(); renderList(); }
  else select(candidates[0]);
  nameRoutes(fresh);
}

/* ---------- Recherche de lieu (Photon, sans compte) ---------- */
let dest = null, destMarker = null, sTimer = null, sRun = 0;
function placeLabel(p){
  const name = p.name || [p.housenumber, p.street].filter(Boolean).join(' ');
  const sub = [p.name && p.street ? [p.housenumber, p.street].filter(Boolean).join(' ') : '', p.city || p.county || '']
    .filter(Boolean).filter(s => s !== name).join(', ');
  return { name: name || p.city || 'Lieu', sub };
}
let lastResults = { q:'', list:[] };
async function searchPlaces(q){
  const run = ++sRun;
  const c = start || meLL || [map.getCenter().lat, map.getCenter().lng];
  let j = null;
  try{
    j = await getJSON('https://photon.komoot.io/api/?lang=fr&limit=6&q=' + encodeURIComponent(q) +
      '&lat=' + c[0].toFixed(4) + '&lon=' + c[1].toFixed(4));
  }catch(e){}
  if(run !== sRun) return;
  const box = $('sres');
  box.innerHTML = '';
  const feats = (j && j.features) || [];
  lastResults = { q, list: feats.map(f => ({ ll:[f.geometry.coordinates[1], f.geometry.coordinates[0]], name:placeLabel(f.properties || {}).name })) };
  if(!feats.length){ box.innerHTML = '<div class="sr"><div><small>Aucun résultat</small></div></div>'; box.hidden = false; return; }
  feats.forEach(f => {
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    const lb = placeLabel(f.properties || {});
    const km = hav(c, ll) / 1000;
    const row = document.createElement('div');
    row.className = 'sr';
    row.innerHTML = '<div><b></b><small></small></div><button data-a="start">Départ</button><button data-a="dest">Arrivée</button>';
    row.querySelector('b').textContent = lb.name;
    row.querySelector('small').textContent = [lb.sub, (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km'].filter(Boolean).join(' · ');
    row.querySelector('[data-a=start]').onclick = () => {
      setStart(ll); map.setView(ll, 15); closeSearch(); msg('Départ : ' + lb.name);
    };
    row.querySelector('[data-a=dest]').onclick = () => { setDest(ll, lb.name); closeSearch(); };
    box.appendChild(row);
  });
  box.hidden = false;
}
function closeSearch(){ $('sres').hidden = true; $('q').value = ''; $('q').blur(); }
$('q').addEventListener('input', () => {
  clearTimeout(sTimer);
  const v = $('q').value.trim();
  if(v.length < 3){ $('sres').hidden = true; return; }
  sTimer = setTimeout(() => searchPlaces(v), 350);
});
$('q').addEventListener('keydown', async e => {
  if(e.key === 'Escape'){ closeSearch(); return; }
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const v = $('q').value.trim();
  if(v.length < 2) return;
  clearTimeout(sTimer);
  if(lastResults.q !== v) await searchPlaces(v);   // résultats pas encore arrivés : on les attend
  const r = lastResults.q === v && lastResults.list[0];
  if(!r) return;
  // Entrée : le 1er résultat devient le départ, et on lance directement les parcours
  setStart(r.ll); map.setView(r.ll, 15); closeSearch();
  if(!$('btnGo').disabled) generate();
});

function setDest(ll, name){
  dest = { ll, name };
  if(!destMarker) destMarker = L.marker(ll, { icon:pin('#dc2626'), zIndexOffset:400 }).addTo(map);
  else destMarker.setLatLng(ll);
  if(st.type !== 'aller') document.querySelector('#segType [data-v=aller]').click();
  $('destChip').hidden = false;
  $('destName').textContent = '🏁 Arrivée : ' + name;
  $('valRow').hidden = $('hint').hidden = true;
  $('btnGo').textContent = 'Générer un parcours';
  updateChip();
  map.fitBounds(L.latLngBounds([start || ll, ll]), { padding:[60, 60] });
}
function clearDest(){
  if(!dest) return;
  dest = null;
  if(destMarker){ map.removeLayer(destMarker); destMarker = null; }
  $('destChip').hidden = true;
  $('valRow').hidden = $('hint').hidden = false;
  updateChip();
}
$('destClear').onclick = clearDest;

/* ---------- Parcours enregistrés (gardés sur cet appareil) ---------- */
let saved = store.get('saved', []);
function persist(){
  try{ localStorage.setItem('prc_saved', JSON.stringify(saved)); return true; }
  catch(e){ msg('Mémoire pleine : supprime ou exporte des parcours.', true); return false; }
}
const isSaved = c => !!c.savedId && saved.some(s => s.id === c.savedId);
const MODE_ICO = { marche:'🚶', course:'🏃', velo:'🚴' };

function saveRoute(c){
  const s = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: titleOf(c, candidates.indexOf(c)), date: new Date().toISOString(), mode: st.mode,
    kind: c.kind, brg: c.brg || 0, distance: Math.round(c.distance), overlap: c.overlap || 0,
    lm: c.lm || [], names: (c.names || []).slice(0, 3),
    coords: c.geometry.coordinates.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)])   // arrondi : prend moins de place
  };
  saved.unshift(s);
  if(!persist()){ saved.shift(); return; }
  c.savedId = s.id; c.savedName = s.name;
  msg('★ Parcours enregistré dans « Mes parcours ».');
}
function unsaveRoute(c){
  saved = saved.filter(s => s.id !== c.savedId); persist();
  c.savedId = null; delete c.savedName;
  msg('Parcours retiré de « Mes parcours ».');
}
function toggleSave(c){ isSaved(c) ? unsaveRoute(c) : saveRoute(c); renderList(); renderSaved(); updateSavedBadge(); }

function fromSaved(s){
  return { geometry:{ type:'LineString', coordinates:s.coords }, distance:s.distance, overlap:s.overlap || 0,
    names:s.names || [], lm:s.lm || [], kind:s.kind, brg:s.brg || 0, savedId:s.id, savedName:s.name };
}
function showSaved(s){
  $('savedModal').classList.add('hidden');
  clearDest();
  if(s.mode && s.mode !== st.mode) document.querySelector('#segMode [data-v="' + s.mode + '"]').click();
  const type = s.kind === 'boucle' ? 'boucle' : 'aller';
  if(st.type !== type) document.querySelector('#segType [data-v="' + type + '"]').click();
  const c = fromSaved(s), f = s.coords[0];
  setStart([f[1], f[0]]);
  genRun++; lastGenKey = ''; userPicked = false;
  candidates = [c];
  select(c);
  $('btnGo').textContent = 'Générer des parcours ici';
}

function renderSaved(){
  const box = $('savedList');
  box.innerHTML = '';
  if(!saved.length){ box.innerHTML = '<p class="empty">Aucun parcours enregistré pour l\'instant.<br>Touche ☆ sur un parcours de la liste pour le garder.</p>'; return; }
  saved.forEach(s => {
    const row = document.createElement('div');
    row.className = 'sv';
    const d = new Date(s.date).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
    row.innerHTML = '<div><input aria-label="Nom du parcours"><small></small></div>' +
      '<button class="see">Voir</button><button class="del" title="Supprimer">🗑</button>';
    const inp = row.querySelector('input');
    inp.value = s.name;
    inp.onchange = () => {   // renommer
      s.name = inp.value.trim() || s.name; inp.value = s.name; persist();
      candidates.forEach(c => { if(c.savedId === s.id) c.savedName = s.name; });
      renderList();
    };
    row.querySelector('small').textContent = [MODE_ICO[s.mode] || '', (s.distance / 1000).toFixed(1) + ' km', s.kind === 'boucle' ? 'boucle' : 'aller simple', d].filter(Boolean).join(' · ');
    row.querySelector('.see').onclick = () => showSaved(s);
    const del = row.querySelector('.del');
    del.onclick = () => {   // 1er appui : demande confirmation, 2e appui : supprime
      if(!del.classList.contains('sure')){ del.classList.add('sure'); del.textContent = 'Supprimer ?'; setTimeout(() => { del.classList.remove('sure'); del.textContent = '🗑'; }, 3000); return; }
      saved = saved.filter(x => x.id !== s.id); persist();
      candidates.forEach(c => { if(c.savedId === s.id){ c.savedId = null; delete c.savedName; } });
      renderSaved(); renderList(); updateSavedBadge();
    };
    box.appendChild(row);
  });
}
function updateSavedBadge(){
  $('svCount').textContent = saved.length;
  $('svCount').hidden = !saved.length;
}
$('btnSaved').onclick = () => { renderSaved(); $('savedModal').classList.remove('hidden'); };
$('svClose').onclick = () => $('savedModal').classList.add('hidden');
$('savedModal').onclick = e => { if(e.target.id === 'savedModal') $('svClose').onclick(); };

// Sauvegarde dans un fichier, et récupération (changement de téléphone, navigateur vidé…)
$('svExport').onclick = () => {
  const blob = new Blob([JSON.stringify(saved)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mes-parcours-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('svImport').onchange = async () => {
  const f = $('svImport').files[0]; if(!f) return;
  try{
    const list = JSON.parse(await f.text());
    if(!Array.isArray(list)) throw 0;
    let n = 0;
    list.forEach(s => { if(s && s.id && Array.isArray(s.coords) && !saved.some(x => x.id === s.id)){ saved.push(s); n++; } });
    saved.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    persist(); renderSaved(); updateSavedBadge();
    msg(n + ' parcours importé' + (n > 1 ? 's' : '') + '.');
  }catch(e){ msg('Fichier non reconnu.', true); }
  $('svImport').value = '';
};
updateSavedBadge();

/* ---------- Photos le long du parcours ---------- */
// 🟠 Wikimedia Commons : photos géolocalisées (monuments, paysages…)
// 🔵 Panoramax : vues depuis la rue / le chemin (équivalent libre de Street View)
let photoRun = 0, lastRoute = null;
// Regroupement des photos proches en un seul badge, qui s'adapte au zoom
const photoLayer = L.markerClusterGroup({
  maxClusterRadius:45, zoomToBoundsOnClick:false, showCoverageOnHover:false, spiderfyOnMaxZoom:false,
  iconCreateFunction: c => L.divIcon({ className:'', iconSize:[34,34], iconAnchor:[17,17],
    html:'<div class="clu">' + CAM_SMALL + c.getChildCount() + '</div>' })
}).addTo(map);
photoLayer.on('clusterclick', e => {
  const list = e.layer.getAllChildMarkers().map(m => m.photo).sort((a, b) => a.idx - b.idx);
  openGallery(list, 0);
});
if(st.photos === undefined) st.photos = true;

function hav(a, b){ // distance en mètres entre [lat,lng]
  const R = 6371000, r = Math.PI / 180;
  const dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const x = Math.sin(dLa/2) ** 2 + Math.cos(a[0]*r) * Math.cos(b[0]*r) * Math.sin(dLo/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// Points régulièrement espacés le long du tracé
function samples(line, step){
  const out = [line[0]]; let acc = 0;
  for(let i = 1; i < line.length; i++){
    acc += hav(line[i-1], line[i]);
    if(acc >= step){ out.push(line[i]); acc = 0; }
  }
  return out;
}
const nearRoute = (line, p, max) => line.some(q => hav(q, p) <= max);
const stripHtml = s => { const d = document.createElement('div'); d.innerHTML = s || ''; return d.textContent.trim(); };

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function inBatches(items, size, fn){
  const out = [];
  for(let i = 0; i < items.length; i += size) out.push(...await Promise.all(items.slice(i, i + size).map(x => fn(x).catch(() => null))));
  return out;
}

async function wikiPhotos(line, length){
  const step = Math.max(400, length / 12);
  const radius = Math.min(10000, Math.round(step * 0.7));
  const res = await inBatches(samples(line, step), 4, p => getJSON(
    'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
    '&generator=geosearch&ggsnamespace=6&ggslimit=15&ggsradius=' + radius +
    '&ggscoord=' + p[0].toFixed(5) + '%7C' + p[1].toFixed(5) +
    '&prop=imageinfo%7Ccoordinates&iiprop=url%7Cextmetadata&iiurlwidth=900' +
    '&iiextmetadatafilter=ObjectName%7CArtist%7CLicenseShortName'));
  const seen = new Set(), out = [];
  res.forEach(j => {
    const pages = j && j.query && j.query.pages; if(!pages) return;
    Object.values(pages).forEach(pg => {
      const ii = pg.imageinfo && pg.imageinfo[0], c = pg.coordinates && pg.coordinates[0];
      if(!ii || !c || seen.has(pg.pageid) || !/\.(jpe?g|png|webp)$/i.test(pg.title)) return;
      const ll = [c.lat, c.lon];
      if(!nearRoute(line, ll, 150)) return;
      seen.add(pg.pageid);
      const m = ii.extmetadata || {};
      out.push({
        src:'wiki', ll, img: ii.thumburl || ii.url, link: ii.descriptionurl,
        title: stripHtml(m.ObjectName && m.ObjectName.value) || pg.title.replace(/^File:|\.[a-z]+$/gi, ''),
        credit: [stripHtml(m.Artist && m.Artist.value), m.LicenseShortName && m.LicenseShortName.value, 'Wikimedia Commons'].filter(Boolean).join(' · ')
      });
    });
  });
  return out.slice(0, 30);
}

async function panoPhotos(line, length){
  const step = Math.max(300, length / 15);
  const pts = samples(line, step).slice(1);
  const d = 0.0004; // ≈ 40 m autour de chaque point
  const res = await inBatches(pts, 5, p => getJSON(
    'https://api.panoramax.xyz/api/search?limit=1&bbox=' +
    [p[1] - d, p[0] - d, p[1] + d, p[0] + d].map(v => v.toFixed(6)).join(',')));
  const out = [];
  res.forEach(j => {
    const f = j && j.features && j.features[0]; if(!f || !f.assets) return;
    const c = f.geometry.coordinates, pr = f.properties || {};
    const io = pr['pers:interior_orientation'] || {};
    const date = pr.datetime ? new Date(pr.datetime).toLocaleDateString('fr-FR', { month:'long', year:'numeric' }) : '';
    out.push({
      src:'pano', ll:[c[1], c[0]], is360: io.field_of_view >= 360,
      img: (f.assets.sd || f.assets.thumb).href, link: (f.assets.hd || f.assets.sd).href,
      title: 'Vue sur le parcours' + (date ? ' (' + date + ')' : ''),
      credit: [pr['geovisio:producer'], pr.license, 'Panoramax'].filter(Boolean).join(' · ')
    });
  });
  return out;
}

const CAM_SMALL = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>';
const CAM = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>';

async function loadPhotos(rt){
  const run = ++photoRun;
  photoLayer.clearLayers();
  if(!st.photos) return;
  const line = rt.geometry.coordinates.map(c => [c[1], c[0]]);
  const base = $('info').innerHTML.replace(/ · 📷.*$/, '');
  $('info').innerHTML = base + ' · 📷 recherche…';
  const [wiki, pano] = await Promise.all([
    wikiPhotos(line, rt.distance).catch(() => []),
    panoPhotos(line, rt.distance).catch(() => [])
  ]);
  if(run !== photoRun) return;   // un autre parcours a été demandé entre-temps
  const all = pano.concat(wiki);
  // Position de chaque photo le long du tracé, pour les faire défiler dans l'ordre du parcours
  all.forEach(p => {
    let best = Infinity;
    for(let i = 0; i < line.length; i++){ const d = hav(line[i], p.ll); if(d < best){ best = d; p.idx = i; } }
  });
  const markers = all.map(p => {
    const m = L.marker(p.ll, { zIndexOffset:500, icon: L.divIcon({ className:'', iconSize:[26,26], iconAnchor:[13,13],
      html:'<div class="ph ' + (p.src === 'wiki' ? 'ph-wiki' : 'ph-pano') + '">' + (p.is360 ? '<b>360</b>' : CAM) + '</div>' }) });
    m.photo = p;
    return m.on('click', () => openGallery([p], 0));
  });
  photoLayer.addLayers(markers);
  $('info').innerHTML = base + ' · 📷 ' + (all.length ? all.length + ' photo' + (all.length > 1 ? 's' : '') : 'aucune photo');
}


/* ---------- Mes photos et vidéos (gardées sur cet appareil) ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('parcours', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('media', { keyPath:'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('media', mode), req = fn(t.objectStore('media'));
      t.oncomplete = () => res(req.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return { all: () => run('readonly', s => s.getAll()), put: m => run('readwrite', s => s.put(m)), del: id => run('readwrite', s => s.delete(id)) };
})();

// Petite image d'aperçu (affichée dans la bulle sur la carte)
function toBlob(cv){ return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8)); }
async function imageThumb(f){
  try{
    const bmp = await createImageBitmap(f), s = Math.min(1, 240 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await toBlob(cv);
  }catch(e){ return null; }
}
function videoThumb(f){
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(f);
    const done = b => { URL.revokeObjectURL(url); res(b); };
    const timer = setTimeout(() => done(null), 5000);
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    v.onloadeddata = () => { try{ v.currentTime = Math.min(0.5, (v.duration || 1) / 2); }catch(e){ clearTimeout(timer); done(null); } };
    v.onseeked = async () => {
      try{
        const s = Math.min(1, 240 / Math.max(v.videoWidth, v.videoHeight));
        const cv = document.createElement('canvas'); cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        clearTimeout(timer); done(await toBlob(cv));
      }catch(e){ clearTimeout(timer); done(null); }
    };
    v.onerror = () => { clearTimeout(timer); done(null); };
  });
}

function minePhoto(m){
  const d = new Date(m.date);
  return { mine:true, media:m, video: m.type === 'video', ll:m.ll,
    title: (m.type === 'video' ? '🎬 ' : '📷 ') + d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }),
    credit: m.name + (m.noGps ? ' · placée à ta position (pas de GPS dans le fichier)' : '') };
}
function renderMine(){
  myLayer.clearLayers();
  if(!st.mine) return;
  myLayer.addLayers(myMedia.map(m => {
    if(m.thumb && !m._thumbUrl) m._thumbUrl = URL.createObjectURL(m.thumb);
    const p = minePhoto(m);
    const mk = L.marker(m.ll, { zIndexOffset:600, icon:L.divIcon({ className:'', iconSize:[34,34], iconAnchor:[17,17],
      html:'<div class="ph ph-me"' + (m._thumbUrl ? ' style="background-image:url(' + m._thumbUrl + ')"' : '') + '>' +
        (m.type === 'video' ? '<i>▶</i>' : (m._thumbUrl ? '' : CAM)) + '</div>' }) });
    mk.photo = p;
    return mk.on('click', () => openGallery([p], 0));
  }));
}

};

async function deleteMine(p){
  try{ await idb.del(p.media.id); }catch(e){ msg('Suppression impossible.', true); return; }

/* ---------- Téléphone : panneau en tiroir façon Android (glisser pour agrandir) ---------- */
var sheetState = 'peek', sheetReady = false;
function sheetH(){
  const vh = window.innerHeight, first = $('list').querySelector('.it');
  // Replié : la ligne de résumé + la ligne d'info + le parcours sélectionné
  const top = $('info').getBoundingClientRect().bottom - $('panel').getBoundingClientRect().top;
  const peek = Math.min(Math.round(vh * 0.6), Math.round(top + (first ? first.offsetHeight + 20 : 10)));
  return { peek, half: Math.max(peek + 80, Math.round(vh * 0.58)), full: vh };
}
function setSheet(s){
  if(!sheetReady || WIDE.matches) return;
  sheetState = s;
  const p = $('panel'), l = $('list');
  p.style.height = sheetH()[s] + 'px';
  p.dataset.state = s;
  document.body.dataset.sheet = s;   // plein écran : on masque la barre de recherche flottante
  // Mi-hauteur et plein écran : la liste défile sans changer la taille du tiroir
  // (on change la taille avec la poignée ou la ligne de résumé) ; replié : glisser sur la liste agrandit le tiroir
  const scrolls = s !== 'peek';
  l.style.touchAction = scrolls ? 'pan-y' : 'none';
  l.style.overflowY = scrolls ? 'auto' : 'hidden';
  if(!scrolls) l.scrollTop = 0;
}
function placeSearch(){
  const s = $('search');
  if(WIDE.matches){
    if(s.parentNode !== $('ctrl')) $('ctrl').insertBefore(s, $('ctrl').firstChild);
    s.classList.remove('floating');
  } else {
    if(s.parentNode !== document.body) document.body.appendChild(s);   // barre de recherche flottante en haut
    s.classList.add('floating');
  }
}

let drag = null, swallowClick = false;
function dragStart(e){
  if(WIDE.matches || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if(e.currentTarget.id === 'list' && sheetState !== 'peek') return;   // mi-hauteur / plein écran : la liste défile normalement
  drag = { x:e.clientX, y:e.clientY, h:$('panel').offsetHeight, id:e.pointerId, el:e.currentTarget, moved:false, axis:null,
           lastX:e.clientX, lastY:e.clientY, lastT:performance.now(), v:0, vx:0 };
}
function pinnedCard(){ return $('list').querySelector('.it.pin'); }
function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(!drag.moved){
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    drag.moved = true;
    // Tiroir replié + geste horizontal sur la liste : on fait défiler les parcours (carrousel)
    drag.axis = Math.abs(dx) > Math.abs(dy) && drag.el.id === 'list' && sheetState === 'peek' && candidates.length > 1 && pinnedCard() ? 'x' : 'y';
    if(drag.axis === 'y') $('panel').classList.add('dragging');
    else pinnedCard().style.transition = 'none';
  }
  const now = performance.now(), dt = Math.max(1, now - drag.lastT);
  if(drag.axis === 'x'){
    const card = pinnedCard();
    if(card){ card.style.transform = 'translateX(' + dx + 'px)'; card.style.opacity = Math.max(.35, 1 - Math.abs(dx) / 500); }
    drag.vx = (e.clientX - drag.lastX) / dt;
  } else {
    const H = sheetH();
    $('panel').style.height = Math.max(H.peek * 0.75, Math.min(H.full, drag.h - dy)) + 'px';
    drag.v = (e.clientY - drag.lastY) / dt;
  }
  drag.lastX = e.clientX; drag.lastY = e.clientY; drag.lastT = now;
}
function dragEnd(e){
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.moved) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
  if(d.axis === 'x'){ swipeEnd(d, (e && e.clientX != null ? e.clientX : d.lastX) - d.x); return; }
  $('panel').classList.remove('dragging');
  const H = sheetH(), h = $('panel').offsetHeight, order = ['peek', 'half', 'full'];
  let s;
  if(d.v < -0.4) s = order.find(k => H[k] > h + 10) || 'full';                    // lancé vers le haut
  else if(d.v > 0.4) s = order.slice().reverse().find(k => H[k] < h - 10) || 'peek';   // lancé vers le bas
  else s = order.reduce((a, k) => Math.abs(H[k] - h) < Math.abs(H[a] - h) ? k : a, 'peek');
  setSheet(s);
}
// Fin du glissé horizontal : parcours précédent (vers la droite) ou suivant (vers la gauche)
function swipeEnd(d, dx){
  const card = pinnedCard();
  if(!card) return;
  const go = Math.abs(dx) > 70 || Math.abs(d.vx) > 0.5;
  card.style.transition = 'transform .18s ease, opacity .18s ease';
  if(!go){ card.style.transform = ''; card.style.opacity = ''; return; }   // pas assez loin : retour en place
  const dir = dx < 0 ? 1 : -1, n = candidates.length;
  const next = candidates[(candidates.indexOf(selected) + dir + n) % n];
  card.style.transform = 'translateX(' + (dir > 0 ? '-110%' : '110%') + ')';
  card.style.opacity = '0';
  setTimeout(() => {
    pick(next);
    const nc = pinnedCard();   // le nouveau parcours arrive du côté opposé
    if(nc){
      nc.style.transition = 'none';
      nc.style.transform = 'translateX(' + (dir > 0 ? '60%' : '-60%') + ')'; nc.style.opacity = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        nc.style.transition = 'transform .2s ease, opacity .2s ease';
        nc.style.transform = ''; nc.style.opacity = '';
      }));
    }
  }, 170);
}
['grab', 'sumrow', 'list'].forEach(id => $(id).addEventListener('pointerdown', dragStart));
// suivi du doigt sur toute la fenêtre (le doigt sort vite de la poignée)
window.addEventListener('pointermove', dragMove);
window.addEventListener('pointerup', dragEnd);
window.addEventListener('pointercancel', dragEnd);
$('panel').addEventListener('click', e => { if(swallowClick){ e.stopPropagation(); e.preventDefault(); } }, true);
$('grab').onclick = () => setSheet(sheetState === 'peek' ? 'half' : 'peek');

function updateChip(){

}
