/* ---------- Mode navigation : on suit le parcours en direct ---------- */
let nav = null, doneLine = null, wakeLock = null;
async function keepAwake(){ try{ if('wakeLock' in navigator && nav) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && nav) keepAwake(); });

function gmapsUrl(c){
  // Ouvre le parcours dans Google Maps (départ, 8 points de passage, arrivée)
  const co = c.geometry.coordinates, pts = [];
  for(let k = 1; k <= 8; k++) pts.push(co[Math.floor(co.length * k / 9)]);
  const f = p => p[1].toFixed(5) + ',' + p[0].toFixed(5);
  return 'https://www.google.com/maps/dir/?api=1&origin=' + f(co[0]) + '&destination=' + f(co[co.length - 1]) +
    '&waypoints=' + encodeURIComponent(pts.map(f).join('|')) + '&travelmode=' + (st.mode === 'velo' ? 'bicycling' : 'walking');
}
function startNav(){
  if(!selected) return;
  const co = selected.geometry.coordinates;
  nav = { c:selected, line:co.map(llOf), arc:cumul(co), idx:0, t0:Date.now(), follow:true, done:false };
  nav.total = nav.arc[nav.arc.length - 1];
  document.body.classList.add('nav');
  $('navMaps').href = gmapsUrl(selected);
  doneLine = L.polyline([], { color:'#94a3b8', weight:6, opacity:.9, interactive:false }).addTo(map);
  keepAwake();
  if(meLL) navUpdate(meLL); else navBar('En attente du GPS…');
  map.setView(meLL || nav.line[0], 17);
}
function stopNav(){
  nav = null;
  document.body.classList.remove('nav');
  if(doneLine){ map.removeLayer(doneLine); doneLine = null; }
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  $('navAlert').hidden = true;
  if(sheetReady && !WIDE.matches) setSheet('peek');
  fitRoute();
}
function navBar(main){
  const el = Math.round((Date.now() - nav.t0) / 60000), done = nav.arc[nav.idx], left = Math.max(0, nav.total - done);
  $('navMain').textContent = main || (fmtKm(left) + ' restants · ≈ ' + fmtMin(left / 1000 / speed() * 60));
  $('navSub').textContent = '⏱ ' + fmtMin(el) + ' · ' + fmtKm(done) + ' parcourus';
  $('navProg').style.width = Math.min(100, done / nav.total * 100) + '%';
}
function navUpdate(ll){
  if(!nav) return;
  // Point du parcours le plus proche, en avançant (une boucle repasse par son départ à la fin)
  const L_ = nav.line, from = Math.max(0, nav.idx - 20), to = Math.min(L_.length - 1, nav.idx + 300);
  let best = Infinity, bi = nav.idx;
  for(let i = from; i <= to; i++){ const d = hav(L_[i], ll); if(d < best){ best = d; bi = i; } }
  if(best > 80){   // pas trouvé près de la position attendue : on cherche sur tout le parcours
    for(let i = 0; i < L_.length; i++){ const d = hav(L_[i], ll); if(d < best){ best = d; bi = i; } }
  }
  if(bi > nav.idx && best < 60) nav.idx = bi;
  doneLine.setLatLngs(L_.slice(0, nav.idx + 1));
  const off = best > 40;
  $('navAlert').hidden = !off;
  if(off) $('navAlert').textContent = '⚠️ Tu t\'éloignes du parcours (' + fmtKm(best) + ')';
  const left = nav.total - nav.arc[nav.idx];
  if(left < 40 && nav.idx > L_.length * 0.7 && !nav.done){ nav.done = true; }
  navBar(nav.done ? '🎉 Parcours terminé !' : null);
  if(nav.follow) map.panTo(ll, { animate:true });
}
map.on('dragstart', () => { if(nav) nav.follow = false; });   // on déplace la carte : on arrête de suivre
setInterval(() => { if(nav && !nav.done) navBar(); }, 30000);
$('btnStart').onclick = startNav;
$('navStop').onclick = stopNav;


/* ---------- Suggestions : lieux à visiter (Wikipédia : photo + description) ---------- */
let tab = 'parcours', suggKey = '', suggRun = 0, suggPlaces = [], suggTours = [];
const placeLayer = L.markerClusterGroup({
  maxClusterRadius:55, showCoverageOnHover:false,
  // groupe = photo du lieu le plus intéressant + nombre de lieux ; toucher = zoomer dessus
  iconCreateFunction: c => {
    const ps = c.getAllChildMarkers().map(m => m.place).sort((a, b) => b.score - a.score);
    return L.divIcon({ className:'', iconSize:[46,46], iconAnchor:[23,23],
      html:'<div class="pl plc" style="background-image:url(' + ps[0].thumb + ')"><span>' + ps.length + '</span></div>' });
  }
}).addTo(map);
const SUG_BADTYPE = /^(country|state|adm|city|edu|event|satellite|airport|railwaystation)/;
const SUG_BADNAME = /^(rue|avenue|boulevard|cours|impasse|chemin|route|liste|arrondissement|quartier|ligne|tunnel|autoroute|gare|station|lycée|collège|école|groupe scolaire|université|institut|hôpital|clinique|centre hospitalier|tramway|métro|échangeur|élection|bataille|siège)\b/i;

const shorten = t => { t = (t || '').replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
  return t.length > 240 ? t.slice(0, 237).replace(/\s+\S*$/, '') + '…' : t; };
function bearingOf(a, b){
  const r = Math.PI / 180, y = Math.sin((b[1]-a[1])*r) * Math.cos(b[0]*r);
  const x = Math.cos(a[0]*r) * Math.sin(b[0]*r) - Math.sin(a[0]*r) * Math.cos(b[0]*r) * Math.cos((b[1]-a[1])*r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const fmtKm = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';

// Lieux intéressants autour de c, dans un rayon donné, avec photo et quelques lignes de description
async function findPlaces(c, radius){
  const centers = radius <= 10000 ? [c] : [c].concat([0, 60, 120, 180, 240, 300].map(b => destPoint(c, radius * 0.6, b)));
  const res = await inBatches(centers, 4, p => getJSON('https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
    '&list=geosearch&gslimit=100&gsprop=type%7Cdim&gsradius=' + Math.round(Math.min(10000, Math.max(200, radius))) +
    '&gscoord=' + p[0].toFixed(5) + '%7C' + p[1].toFixed(5)).then(j => (j.query && j.query.geosearch) || []));
  const seen = new Map();
  res.flat().forEach(g => {
    if(!g || seen.has(g.pageid) || (g.type && SUG_BADTYPE.test(g.type)) || SUG_BADNAME.test(g.title)) return;
    const d = hav(c, [g.lat, g.lon]);
    if(d > radius) return;
    const score = (LM_STRONG.test(g.title) ? 3 : 0) + (LM_KEY.test(g.title) ? 2 : 0) + (g.type === 'landmark' ? 2 : 0) +
                  (/^(waterbody|forest|isle|mountain)$/.test(g.type || '') ? 2 : 0);
    if(score < 2) return;   // on ne garde que des lieux "à visiter"
    seen.set(g.pageid, { id:g.pageid, title:cleanName(g.title), ll:[g.lat, g.lon], dist:d, score });
  });
  const top = [...seen.values()].sort((a, b) => b.score - a.score || a.dist - b.dist).slice(0, 40);
  const chunks = [];
  for(let i = 0; i < top.length; i += 20) chunks.push(top.slice(i, i + 20));
  const det = await inBatches(chunks, 2, ch => getJSON('https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
    '&prop=pageimages%7Cextracts%7Cinfo&inprop=url&piprop=thumbnail&pithumbsize=640&exintro=1&explaintext=1&exsentences=3&exlimit=20' +
    '&pageids=' + ch.map(p => p.id).join('%7C')));
  const byId = new Map();
  det.forEach(j => { const pg = j && j.query && j.query.pages; if(pg) Object.values(pg).forEach(x => byId.set(x.pageid, x)); });
  return top.map(p => {
    const pg = byId.get(p.id);
    if(!pg || !pg.thumbnail) return null;   // uniquement des lieux avec une photo
    return Object.assign(p, { thumb:pg.thumbnail.source, url:pg.fullurl || 'https://fr.wikipedia.org/?curid=' + p.id, extract:shorten(pg.extract) });
  }).filter(Boolean);
}

// Boucles qui passent par des lieux à visiter : 3 directions, lieux dans l'ordre du tour
function planTours(places, target){
  const tours = [], off = Math.random() * 120, est = pts => { let d = 0; for(let i = 1; i < pts.length; i++) d += hav(pts[i-1], pts[i]); return d * 1.3; };
  places.forEach(p => { p.brg = bearingOf(start, p.ll); });
  [off, off + 120, off + 240].forEach(dir => {
    const rel = p => ((p.brg - dir + 540) % 360) - 180;
    const pool = places.filter(p => Math.abs(rel(p)) <= 75 && p.dist <= target * 0.42).sort((a, b) => b.score - a.score || a.dist - b.dist);
    let chosen = [];
    for(const p of pool){
      if(chosen.length >= 5) break;
      const t = chosen.concat([p]).sort((a, b) => rel(a) - rel(b));
      if(est([start].concat(t.map(x => x.ll), [start])) <= target * 1.05) chosen = t;
    }
    const k = chosen.map(x => x.id).sort().join();
    if(chosen.length && !tours.some(t => t.key === k)) tours.push({ dir, places:chosen, pool, rel, key:k });
  });
  return tours;
}
async function routeTour(base, t, target){
  let places = t.places.slice(), stretch = 0, best = null;
  for(let i = 0; i < 4; i++){
    // Points de passage : les lieux dans l'ordre du tour (+ un point de détour si la balade est trop courte)
    let pts = places.map(p => ({ ll:p.ll, r:t.rel(p) }));
    if(stretch > 0){
      const far = Math.max(...places.map(p => p.dist));
      pts.push({ ll:destPoint(start, far + stretch, t.dir), r:0 });
      pts.sort((a, b) => a.r - b.r);
    }
    const j = await route(base, [start].concat(pts.map(p => p.ll), [start]));
    const r = j.routes[0];
    const c = makeCandidate(r, r.geometry.coordinates, { kind:'boucle', brg:t.dir, places });
    if(fits(c, target)) return c;
    if(c.distance > target){   // trop long : on retire le lieu le moins intéressant (ou on réduit le détour)
      if(stretch > 0){ stretch = Math.max(0, stretch - (c.distance - target) / 2.6); continue; }
      if(places.length <= 1) return null;
      const weakest = places.slice().sort((a, b) => a.score - b.score)[0];
      places = places.filter(p => p !== weakest);
    } else {                   // trop court : un lieu de plus dans cette direction, sinon un petit détour
      const extra = t.pool.find(p => !places.includes(p));
      if(extra && !stretch) places = places.concat([extra]).sort((a, b) => t.rel(a) - t.rel(b));
      else stretch += (target - c.distance) / 2.6;
    }
  }
  return null;
}

/* --- Affichage --- */
function placeMarker(p){
  const on = tab === 'sugg' && st.type !== 'boucle' && suggPlaces[sugIdx] === p;   // suggestion choisie : plus grande
  const s = on ? 54 : 40;
  const m = L.marker(p.ll, { zIndexOffset:on ? 900 : 650, icon:L.divIcon({ className:'', iconSize:[s,s], iconAnchor:[s/2,s/2],
    html:'<div class="pl' + (on ? ' on' : '') + '" style="background-image:url(' + p.thumb + ')"></div>' }) })
    .on('click', () => openGallery([{ img:p.thumb, link:p.url, title:p.title, credit:p.extract + ' — Wikipédia' }], 0));
  m.place = p;
  return m;
}
function showPlaces(){
  placeLayer.clearLayers();
  const list = tab === 'sugg' && !dest
    ? (st.type === 'boucle' ? ((suggTours[sugIdx] && suggTours[sugIdx].places) || []) : suggPlaces)
    : (selected && selected.places) || [];
  placeLayer.addLayers(list.map(placeMarker));
}
// Mini-liste des suggestions (même format que la liste des parcours)
function miniCard(thumb, title, sub, right, onView, onThumb, onSelect){
  const d = document.createElement('div');
  d.className = 'it sg';
  d.innerHTML = '<img class="th" loading="lazy" alt=""><div><b></b><small></small></div>' +
    (right ? '<span class="km">' + right + '</span>' : '') + '<button class="vbtn">Voir parcours</button>';
  d.querySelector('img').src = thumb;
  d.querySelector('b').textContent = title;
  d.querySelector('small').textContent = sub;
  d.querySelector('.vbtn').onclick = e => { e.stopPropagation(); onView(); };
  d.querySelector('img').onclick = e => { e.stopPropagation(); onThumb(); };
  d.onclick = onSelect || onThumb;
  return d;
}
function placeCard(p, withGo){
  const desc = (p.extract.match(/^.*?[.!?](\s|$)/) || [p.extract])[0].trim();
  return miniCard(p.thumb, p.title, 'à ' + fmtKm(p.dist) + ' · ' + desc, '',
    () => viewPlace(p),
    () => openGallery([{ img:p.thumb, link:p.url, title:p.title, credit:p.extract + ' — Wikipédia' }], 0),
    () => pickSugg(suggPlaces.indexOf(p)));
}
function tourCard(c){
  const km = c.distance / 1000, n = c.places.length;
  return miniCard(c.places[0].thumb, 'Visite · ' + c.places.slice(0, 2).map(p => p.title).join(', ') + (n > 2 ? ' +' + (n - 2) : ''),
    n + ' lieu' + (n > 1 ? 'x' : '') + ' à voir · côté ' + dirOf(c.brg),
    km.toFixed(1) + ' km<small>≈ ' + fmtMin(km / speed() * 60) + '</small>',
    () => viewTour(c),
    () => openGallery(c.places.map(x => ({ img:x.thumb, link:x.url, title:x.title, credit:x.extract + ' — Wikipédia' })), 0));
}

// Version détaillée (grande photo, description, étapes de la balade)
function placeBig(p){
  const d = document.createElement('div');
  d.className = 'pc';
  d.innerHTML = '<img loading="lazy" alt=""><div class="pcb"><b></b><span class="pcd"></span><p></p>' +
    '<div class="pca"><button class="vbtn">Voir parcours</button><a target="_blank" rel="noopener">Wikipédia</a></div></div>';
  d.querySelector('img').src = p.thumb;
  d.querySelector('b').textContent = p.title;
  d.querySelector('.pcd').textContent = 'à ' + fmtKm(p.dist) + ' à vol d\'oiseau';
  d.querySelector('p').textContent = p.extract;
  d.querySelector('a').href = p.url;
  d.querySelector('img').onclick = () => openGallery([{ img:p.thumb, link:p.url, title:p.title, credit:p.extract + ' — Wikipédia' }], 0);
  d.querySelector('.vbtn').onclick = e => { e.stopPropagation(); viewPlace(p); };
  d.querySelector('a').onclick = e => e.stopPropagation();
  d.onclick = () => pickSugg(suggPlaces.indexOf(p));
  return d;
}
function tourBig(c){
  const km = c.distance / 1000, d = document.createElement('div');
  d.className = 'tc';
  d.innerHTML = '<div class="tch"><div><b></b><small></small></div><span class="km">' + km.toFixed(1) + ' km<small>≈ ' +
    fmtMin(km / speed() * 60) + '</small></span></div><div class="tcp"></div><div class="tcl"></div><button class="vbtn wide">Voir parcours</button>';
  d.querySelector('b').textContent = 'Balade · ' + c.places.length + ' lieu' + (c.places.length > 1 ? 'x' : '') + ' à voir';
  d.querySelector('small').textContent = 'côté ' + dirOf(c.brg);
  const strip = d.querySelector('.tcp'), lines = d.querySelector('.tcl');
  c.places.forEach((p, i) => {
    const f = document.createElement('figure');
    f.innerHTML = '<img loading="lazy" alt=""><figcaption></figcaption>';
    f.querySelector('img').src = p.thumb;
    f.querySelector('figcaption').textContent = (i + 1) + '. ' + p.title;
    f.onclick = () => openGallery(c.places.map(x => ({ img:x.thumb, link:x.url, title:x.title, credit:x.extract + ' — Wikipédia' })), i);
    strip.appendChild(f);
    const l = document.createElement('p');
    l.innerHTML = '<b></b> — <span></span>';
    l.querySelector('b').textContent = (i + 1) + '. ' + p.title;
    l.querySelector('span').textContent = (p.extract.match(/^.*?[.!?](\s|$)/) || [p.extract])[0].trim();
    lines.appendChild(l);
  });
  d.querySelector('.vbtn').onclick = () => viewTour(c);
  return d;
}
function viewPlace(p){ setDest(p.ll, p.title); keepSheetOnce = true; setTab('parcours'); generate(); }   // itinéraire vers ce lieu
function viewTour(c){ candidates = suggTours.slice(); lastGenKey = ''; userPicked = true; setTab('parcours'); select(c, false, true); }

/* --- Liste des suggestions : compacte ou détaillée ; tiroir replié = une suggestion à la fois --- */
let sugDetail = !!st.sugDetail, sugIdx = 0, sugHead = '', sugBusy = '', sugMsg = '';
const sugItems = () => st.type === 'boucle' ? suggTours : suggPlaces;
const sugPeek = () => sheetReady && !WIDE.matches && sheetState === 'peek';
function renderSugg(){
  const box = $('sugg'), items = sugItems(), detail = sugDetail && !sugPeek();
  const keepY = box.scrollTop;
  box.innerHTML = '';
  if(sugHead){
    const h = document.createElement('div');
    h.className = 'sg-h';
    h.innerHTML = '<button class="sgDet' + (sugDetail ? ' on' : '') + '">' + (sugDetail ? '☰ Liste' : '▤ Détails') + '</button><span></span>';
    h.querySelector('span').textContent = sugHead;
    h.querySelector('button').onclick = () => { sugDetail = !sugDetail; st.sugDetail = sugDetail; store.set('st', st); renderSugg(); };
    box.appendChild(h);
  }
  sugIdx = Math.min(sugIdx, Math.max(0, items.length - 1));
  items.forEach((x, i) => {
    const el = st.type === 'boucle' ? (detail ? tourBig(x) : tourCard(x)) : (detail ? placeBig(x) : placeCard(x));
    el.dataset.i = i;
    if(i === sugIdx) el.classList.add('cur');
    box.appendChild(el);
  });
  [sugBusy, sugMsg].filter(Boolean).forEach(t => { const p = document.createElement('p'); p.className = 'sg-msg'; p.textContent = t; box.appendChild(p); });
  box.scrollTop = keepY;
  if(tab === 'sugg') showPlaces();
}
// Centre la carte sur ll dans la zone visible (au-dessus du tiroir sur téléphone, à droite du panneau sur PC)
function centerVisible(ll, z){
  const p = $('panel');
  let dx = 0, dy = 0;
  if(WIDE.matches) dx = -(p.offsetWidth + 12) / 2;
  else dy = (p.offsetHeight - 70) / 2;
  const pt = map.project(ll, z).add([dx, dy]);
  map.setView(map.unproject(pt, z), z);
}
// Suggestion mise en avant sur la carte (glissé gauche / droite tiroir replié)
function focusSugg(){
  const x = sugItems()[sugIdx];
  if(!x) return;
  showPlaces();
  if(st.type === 'boucle') map.fitBounds(L.latLngBounds(x.geometry.coordinates.map(llOf)), { paddingTopLeft:[30, 80], paddingBottomRight:[70, $('panel').offsetHeight + 20] });
  else centerVisible(x.ll, Math.max(map.getZoom(), 15));
}
// Toucher une suggestion (liste agrandie, aller simple) : surlignée + centrée sur la carte
function pickSugg(i){
  sugIdx = i;
  [...$('sugg').children].forEach(el => el.classList.toggle('cur', +el.dataset.i === i));
  if(sheetReady && !WIDE.matches && sheetState === 'full'){   // plein écran : on libère un peu de carte, puis on centre
    setSheet('half');
    setTimeout(focusSugg, 320);
  } else focusSugg();
}

async function runSugg(){
  sugMsg = ''; sugBusy = '';
  if(!start){ sugHead = ''; sugMsg = 'Place d\'abord ton départ (🎯 ou touche la carte).'; renderSugg(); return; }
  if(dest){ sugHead = ''; sugMsg = 'Efface l\'arrivée choisie (🗑) pour voir des suggestions autour de toi.'; renderSugg(); return; }
  const target = targetMeters(), loop = st.type === 'boucle';
  const key = [start[0].toFixed(4), start[1].toFixed(4), st.mode, st.type, Math.round(target)].join('|');
  if(key === suggKey){ renderSugg(); return; }
  const run = ++suggRun;
  suggKey = key; suggPlaces = []; suggTours = []; sugIdx = 0; sugHead = '';
  const radius = loop ? target * 0.42 : target / 1.3;
  sugBusy = '🔎 Recherche des lieux à visiter à moins de ' + fmtKm(radius) + '…';
  renderSugg(); if(sheetReady && !WIDE.matches) setSheet(sheetState);
  let places = [];
  try{ places = await findPlaces(start, radius); }catch(e){}
  if(run !== suggRun) return;
  sugBusy = '';
  if(!places.length){ sugMsg = 'Aucun lieu à visiter trouvé dans ce rayon. Essaie une distance plus grande.'; suggKey = ''; renderSugg(); return; }

  if(!loop){
    // Aller simple : lieux touristiques dans le rayon, du plus proche au plus loin
    suggPlaces = places.sort((a, b) => a.dist - b.dist);
    sugHead = places.length + ' lieu' + (places.length > 1 ? 'x' : '') + ' à visiter à moins de ' + fmtKm(radius);
    renderSugg(); if(sheetReady && !WIDE.matches) setSheet(sheetState);
    return;
  }
  // Boucle : balades qui passent par des lieux à visiter
  const tours = planTours(places, target), base = PROFILES[st.mode];
  sugHead = 'Balades de ' + fmtKm(target) + ' avec des lieux à visiter';
  for(let i = 0; i < tours.length; i++){
    if(run !== suggRun) return;
    sugBusy = 'Calcul des balades… ' + (i + 1) + ' / ' + tours.length;
    renderSugg(); if(sheetReady && !WIDE.matches) setSheet(sheetState);
    try{
      const c = await routeTour(base, tours[i], target);
      if(run !== suggRun) return;
      if(c && !suggTours.some(o => similarity(c, o) > 0.7)) suggTours.push(c);
    }catch(e){ break; }
  }
  sugBusy = '';
  if(!suggTours.length){ sugMsg = 'Pas de balade à ±' + fmtKm(tolerance(target)) + ' de ton objectif avec ces lieux. Essaie une autre distance.'; suggKey = ''; }
  renderSugg(); if(sheetReady && !WIDE.matches) setSheet(sheetState);
}
function setTab(t){
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('list').hidden = t !== 'parcours';
  $('sugg').hidden = t !== 'sugg';
  if(t === 'sugg') runSugg();
  showPlaces();
  if(sheetReady && !WIDE.matches) setSheet(sheetState);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));

/* ---------- Téléphone : panneau en tiroir façon Android (glisser pour agrandir) ---------- */
var sheetState = 'peek', sheetReady = false;
function sheetH(){
  const vh = window.innerHeight, first = $('list').querySelector('.it');
  // Replié : la ligne de résumé + la ligne d'info + le parcours sélectionné
  const top = $('tabs').getBoundingClientRect().bottom - $('panel').getBoundingClientRect().top;
  const cur = tab === 'parcours' ? first : ($('sugg').querySelector('.cur') || $('sugg').querySelector('.sg-msg'));
  const peek = Math.min(Math.round(vh * 0.6), Math.round(top + (cur ? cur.offsetHeight + 24 : 10)));
  return { peek, half: Math.max(peek + 80, Math.round(vh * 0.58)), full: vh };
}
// Le bouton de localisation suit le haut du tiroir (masqué quand le tiroir prend presque tout l'écran)
function setSheetVar(px){
  document.documentElement.style.setProperty('--sheet', Math.round(px) + 'px');
  document.body.classList.toggle('sheet-tall', px > window.innerHeight * 0.7);
}
function setSheet(s){
  if(!sheetReady || WIDE.matches) return;
  const wasPeek = sheetState === 'peek';
  sheetState = s;
  if(tab === 'sugg' && sugDetail && wasPeek !== (s === 'peek')) renderSugg();
  const p = $('panel'), l = $('list');
  p.style.height = sheetH()[s] + 'px';
  setSheetVar(sheetH()[s]);
  p.dataset.state = s;
  document.body.dataset.sheet = s;   // plein écran : on masque la barre de recherche flottante
  // Mi-hauteur et plein écran : la liste défile sans changer la taille du tiroir
  // (on change la taille avec la poignée ou la ligne de résumé) ; replié : glisser sur la liste agrandit le tiroir
  const scrolls = s !== 'peek';
  [l, $('sugg')].forEach(el => {
    el.style.touchAction = scrolls ? 'pan-y' : 'none';
    el.style.overflowY = scrolls ? 'auto' : 'hidden';
    if(!scrolls) el.scrollTop = 0;
  });
}
function placeSearch(){
  const s = $('search');
  if(WIDE.matches){
    if(s.parentNode !== $('ctrl')) $('ctrl').insertBefore(s, $('ctrl').firstChild);
    s.classList.remove('floating');
  } else {
    if(s.parentNode !== document.body) document.body.appendChild(s);   // barre de recherche flottante en haut
    s.classList.add('floating');
  }
}

let drag = null, swallowClick = false;
function dragStart(e){
  if(WIDE.matches || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if((e.currentTarget.id === 'list' || e.currentTarget.id === 'sugg') && sheetState !== 'peek') return;   // mi-hauteur / plein écran : la liste défile normalement
  drag = { x:e.clientX, y:e.clientY, h:$('panel').offsetHeight, id:e.pointerId, el:e.currentTarget, moved:false, axis:null,
           lastX:e.clientX, lastY:e.clientY, lastT:performance.now(), v:0, vx:0 };
}
function pinnedCard(){ return $('list').querySelector('.it.pin'); }
function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(!drag.moved){
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    drag.moved = true;
    // Tiroir replié + geste horizontal sur la liste : on fait défiler les parcours (carrousel)
    drag.card = drag.el.id === 'list' ? (candidates.length > 1 && pinnedCard()) : drag.el.id === 'sugg' ? (sugItems().length > 1 && $('sugg').querySelector('.cur')) : null;
    drag.axis = Math.abs(dx) > Math.abs(dy) && sheetState === 'peek' && drag.card ? 'x' : 'y';
    if(drag.axis === 'y') $('panel').classList.add('dragging');
    else drag.card.style.transition = 'none';
  }
  const now = performance.now(), dt = Math.max(1, now - drag.lastT);
  if(drag.axis === 'x'){
    const card = drag.card;
    if(card){ card.style.transform = 'translateX(' + dx + 'px)'; card.style.opacity = Math.max(.35, 1 - Math.abs(dx) / 500); }
    drag.vx = (e.clientX - drag.lastX) / dt;
  } else {
    const H = sheetH();
    const hh = Math.max(H.peek * 0.75, Math.min(H.full, drag.h - dy));
    $('panel').style.height = hh + 'px';
    setSheetVar(hh);
    document.body.classList.add('sheet-drag');
    drag.v = (e.clientY - drag.lastY) / dt;
  }
  drag.lastX = e.clientX; drag.lastY = e.clientY; drag.lastT = now;
}
function dragEnd(e){
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.moved) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
  if(d.axis === 'x'){ swipeEnd(d, (e && e.clientX != null ? e.clientX : d.lastX) - d.x); return; }
  $('panel').classList.remove('dragging');
  document.body.classList.remove('sheet-drag');
  const H = sheetH(), h = $('panel').offsetHeight, order = ['peek', 'half', 'full'];
  let s;
  if(d.v < -0.4) s = order.find(k => H[k] > h + 10) || 'full';                    // lancé vers le haut
  else if(d.v > 0.4) s = order.slice().reverse().find(k => H[k] < h - 10) || 'peek';   // lancé vers le bas
  else s = order.reduce((a, k) => Math.abs(H[k] - h) < Math.abs(H[a] - h) ? k : a, 'peek');
  setSheet(s);
}
// Fin du glissé horizontal : parcours précédent (vers la droite) ou suivant (vers la gauche)
function swipeEnd(d, dx){
  const card = d.card;
  if(!card) return;
  const isSugg = d.el.id === 'sugg';
  const go = Math.abs(dx) > 70 || Math.abs(d.vx) > 0.5;
  card.style.transition = 'transform .18s ease, opacity .18s ease';
  if(!go){ card.style.transform = ''; card.style.opacity = ''; return; }   // pas assez loin : retour en place
  const dir = dx < 0 ? 1 : -1, n = isSugg ? sugItems().length : candidates.length;
  const next = isSugg ? null : candidates[(candidates.indexOf(selected) + dir + n) % n];
  card.style.transform = 'translateX(' + (dir > 0 ? '-110%' : '110%') + ')';
  card.style.opacity = '0';
  setTimeout(() => {
    if(isSugg){ sugIdx = (sugIdx + dir + n) % n; renderSugg(); setSheet('peek'); focusSugg(); }
    else pick(next);
    const nc = isSugg ? $('sugg').querySelector('.cur') : pinnedCard();   // le nouveau arrive du côté opposé
    if(nc){
      nc.style.transition = 'none';
      nc.style.transform = 'translateX(' + (dir > 0 ? '60%' : '-60%') + ')'; nc.style.opacity = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        nc.style.transition = 'transform .2s ease, opacity .2s ease';
        nc.style.transform = ''; nc.style.opacity = '';
      }));
    }
  }, 170);
}
['grab', 'sumrow', 'tabs', 'list', 'sugg'].forEach(id => $(id).addEventListener('pointerdown', dragStart));
// suivi du doigt sur toute la fenêtre (le doigt sort vite de la poignée)
window.addEventListener('pointermove', dragMove);
window.addEventListener('pointerup', dragEnd);
window.addEventListener('pointercancel', dragEnd);
$('panel').addEventListener('click', e => { if(swallowClick){ e.stopPropagation(); e.preventDefault(); } }, true);
$('grab').onclick = () => setSheet(sheetState === 'peek' ? 'half' : 'peek');

// Ligne de résumé : réglages en un coup d'œil (toucher = ouvrir les réglages) + bouton Générer
function updateChip(){
  const ico = { marche:'🚶', course:'🏃', velo:'🚴' }, lbl = { marche:'Marche', course:'Course', velo:'Vélo' };
  const v = getVal();
  const what = dest ? '→ ' + dest.name : (!v ? '?' : st.unit === 'min' ? fmtMin(v) : String(v).replace('.', ',') + ' km');
  $('chipTxt').textContent = ico[st.mode] + ' ' + lbl[st.mode] + ' · ' + (st.type === 'boucle' ? 'Boucle' : (st.withReturn ? 'Aller-retour' : 'Aller')) + ' · ' + what;
}
$('chip').onclick = () => {
  const open = !$('panel').classList.contains('open');
  $('panel').classList.toggle('open', open);
  setSheet(open && sheetState === 'peek' ? 'half' : sheetState);
};
$('go2').onclick = () => $('btnGo').click();
new MutationObserver(() => {   // le bouton du résumé suit l'état du grand bouton
  const b = $('btnGo'), t = b.textContent, m = t.match(/(\d+) \/ (\d+)/);
  $('go2').disabled = b.disabled;
  $('go2').textContent = b.disabled ? (m ? '⏳ ' + m[1] + '/' + m[2] : '⏳') : (/Autres/.test(t) ? '🔁 Autres' : 'Générer');
}).observe($('btnGo'), { childList:true, characterData:true, subtree:true, attributes:true });

sheetReady = true;
updateChip();
applyLayout();
setSheet('peek');

</script>
